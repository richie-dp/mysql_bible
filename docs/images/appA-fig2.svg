<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker></defs>
<rect width="960" height="680" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 A-2　内存预算的四层分配：只调大第一层，第二层会按并发吃回来</text>
<text x="24" y="60" font-size="12" fill="#6b7280">竖条按示意比例切分，不是精确占比；第二层是唯一随并发线性增长的一层</text>
<text x="110" y="100" font-size="11" fill="#6b7280" text-anchor="start" font-weight="600" >物理内存 128G（示例）</text>
<rect x="110" y="110" width="140" height="235" rx="0" ry="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="180.0" y="219.5" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >buffer pool</text>
<text x="180.0" y="239.5" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="400" >64G 预分配</text>
<rect x="110" y="345" width="140" height="146" rx="0" ry="0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="180.0" y="410.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >每连接 × 并发</text>
<text x="180.0" y="430.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="400" >峰值 40G</text>
<rect x="110" y="491" width="140" height="29" rx="0" ry="0" fill="#9333ea" stroke="#9333ea" stroke-width="1"/>
<text x="180.0" y="509.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" >临时表 8G</text>
<rect x="110" y="520" width="140" height="60" rx="0" ry="0" fill="#475569" stroke="#475569" stroke-width="1"/>
<text x="180.0" y="554.0" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" >OS 与余量 16G</text>
<path d="M 250.0,227.0 L 274.0,227.0 L 274.0,181.0 L 296.0,181.0" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linejoin="round"/>
<rect x="300" y="150" width="340" height="62" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="470.0" y="176.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >buffer pool</text>
<text x="470.0" y="196.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >预分配，命中率的天花板由它定</text>
<path d="M 250.0,418.0 L 280.0,418.0 L 280.0,266.0 L 296.0,266.0" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linejoin="round"/>
<rect x="300" y="235" width="340" height="62" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="261.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >每连接 buffer</text>
<text x="470.0" y="281.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >2M × 200 = 400M；256M × 160 = 40G</text>
<path d="M 250.0,505.0 L 286.0,505.0 L 286.0,351.0 L 296.0,351.0" fill="none" stroke="#9333ea" stroke-width="1.3" stroke-linejoin="round"/>
<rect x="300" y="320" width="340" height="62" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="470.0" y="346.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >临时表</text>
<text x="470.0" y="366.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >temptable_max_ram 是全局共享上限</text>
<path d="M 250.0,550.0 L 292.0,550.0 L 292.0,436.0 L 296.0,436.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-linejoin="round"/>
<rect x="300" y="405" width="340" height="62" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="431.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >OS 与余量</text>
<text x="470.0" y="451.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >page cache、备份顺序读、内核自身</text>
<rect x="684" y="110" width="228" height="470" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="698" y="132" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >只调大第一层</text>
<rect x="700" y="146" width="196" height="54" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="798.0" y="168.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >BP 64G → 96G</text>
<text x="798.0" y="188.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >只加第一层</text>
<path d="M 798.0,200.0 L 798.0,218.0" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="700" y="218" width="196" height="54" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="798.0" y="240.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >总需求 160G</text>
<text x="798.0" y="260.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >四层相加超 128G</text>
<path d="M 798.0,272.0 L 798.0,290.0" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="700" y="290" width="196" height="54" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="798.0" y="312.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >OOM Killer</text>
<text x="798.0" y="332.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >按 anon-rss 排序</text>
<rect x="700" y="366" width="196" height="140" rx="6" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<text x="712" y="383" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400" >预算公式</text>
<text x="712" y="404" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">RSS ≈ BP</text>
<text x="712" y="420" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">+ 固定开销</text>
<text x="712" y="436" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">+ Σ(buffer×并发)</text>
<text x="712" y="452" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">+ 临时表</text>
<text x="700" y="540" font-size="10" fill="#dc2626" text-anchor="start" font-weight="500" >顺序不能反：先压第二层，</text>
<text x="700" y="558" font-size="10" fill="#dc2626" text-anchor="start" font-weight="500" >再加第一层。</text>
<text x="110" y="606" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >四层之和必须小于物理内存。只调大第一层，省下的空间会被第二层按并发吃回去。</text>
<text x="110" y="628" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >第二层平时不出现，只在导出、对账的并发高峰出现——案例八那次 OOM 就是它的形状。</text>
</svg>