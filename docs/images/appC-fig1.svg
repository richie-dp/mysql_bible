<text x="48" y="418" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >同一句「挂了」，在六个环节里的后果完全不同：</text>
<rect x="48" y="434" width="260" height="68" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="178.0" y="463.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >写坏数据 / 回不来</text>
<text x="178.0" y="483.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >变更、备份、同步：出事那天才发现</text>
<rect x="350" y="434" width="260" height="68" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="480.0" y="463.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >暂时不可用</text>
<text x="480.0" y="483.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >复制、路由：告警会响，切完就好</text>
<rect x="652" y="434" width="260" height="68" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="782.0" y="463.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >只是看不见</text>
<text x="782.0" y="483.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >诊断：不响，等你从业务报错里发现</text>
<text x="48" y="534" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >颜色往右（SLATE）的可以晚上线、可以少人维护；颜色往左（RED）的必须有人值班、必须有演练。</text>
<text x="48" y="556" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >位置越靠近接入与同步，一次故障波及的请求比例越高 —— 这是 ProxySQL 与一个定时校验脚本的根本差别。</text>
<rect x="48" y="584" width="864" height="88" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="68" y="616" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >越往右，故障面越大：诊断工具挂了，你失去的是视野；接入层挂了，你失去的是全部请求。</text>
<text x="68" y="640" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >所以左边两段可以容忍「用得少」，右边两段必须有人随时知道它现在是什么状态。</text>
</svg>