<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 1-2　一条 UPDATE 的时序：redo 与 binlog 如何对齐</text>
<text x="24" y="60" font-size="12" fill="#6b7280">两个日志分属不同层，靠内部 XA 的两阶段提交保证一致</text>
<rect x="42" y="76" width="156" height="48" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="120.0" y="95.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >执行器</text>
<text x="120.0" y="115.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >(Server 层)</text>
<line x1="120" y1="124" x2="120" y2="560" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="302" y="76" width="156" height="48" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="380.0" y="95.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >InnoDB</text>
<text x="380.0" y="115.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >Buffer Pool + undo</text>
<line x1="380" y1="124" x2="380" y2="560" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="562" y="76" width="156" height="48" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="640.0" y="95.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >redo log</text>
<text x="640.0" y="115.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >(log buffer)</text>
<line x1="640" y1="124" x2="640" y2="560" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="772" y="76" width="156" height="48" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="850.0" y="95.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >binlog</text>
<text x="850.0" y="115.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >(Server 层)</text>
<line x1="850" y1="124" x2="850" y2="560" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<path d="M 120.0,168.0 L 380.0,168.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="169.1" y="151.0" width="161.8" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="250.0" y="161.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500" >① 按 id=1 定位，加 X 记录锁</text>
<path d="M 380.0,214.0 L 640.0,214.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
<rect x="420.5" y="197.0" width="178.9" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="510.0" y="207.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="500" >② 记 undo：旧值 c=1 写入版本链</text>
<path d="M 120.0,260.0 L 380.0,260.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="158.3" y="243.0" width="183.3" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="250.0" y="253.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500" >③ 修改数据页（成为脏页，未落盘）</text>
<path d="M 380.0,306.0 L 640.0,306.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="420.3" y="289.0" width="179.4" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="510.0" y="299.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >④ 写 redo，trx 状态 = prepare</text>
<rect x="60" y="326" width="840" height="150" rx="10" ry="10" fill="#fffdf5" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="74" y="348" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >内部 XA：第二阶段（binlog 落盘后才允许 commit）</text>
<path d="M 120.0,366.0 L 850.0,366.0" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_9333ea)"/>
<rect x="392.9" y="349.0" width="184.2" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="485.0" y="359.0" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="500" >⑤ 写 binlog（ROW 格式）+ fsync</text>
<path d="M 380.0,412.0 L 640.0,412.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="441.9" y="395.0" width="136.2" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="510.0" y="405.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >⑥ redo 状态改为 commit</text>
<text x="440" y="462" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >⑦ 返回「1 row affected」——此时数据页可能还在内存里</text>
<rect x="60" y="470" width="400" height="110" rx="6" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<text x="72" y="487" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400" >恢复判据</text>
<text x="72" y="508" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"># 崩溃点不同，恢复行为不同：</text>
<text x="72" y="525" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">prepare 前崩溃   → 回滚（redo 无效）</text>
<text x="72" y="542" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">prepare 后、binlog 前崩溃 → 回滚</text>
<text x="72" y="559" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">binlog 完整后崩溃 → 提交（重放 binlog）</text>
<path d="M 520 486 L 546 486" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="553" y="490" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >SQL 层动作</text>
<path d="M 520 506 L 546 506" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#m_e_ea580c)"/>
<text x="553" y="510" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >undo 写入</text>
<path d="M 520 526 L 546 526" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="553" y="530" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >redo 写入</text>
<path d="M 520 546 L 546 546" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="553" y="550" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >binlog 写入</text>
</svg>