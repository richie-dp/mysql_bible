<text x="502" y="327" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600" >64 个页 = 1 个区 = 1MB</text>
<rect x="832" y="308" width="60.0" height="20" rx="10" ry="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="862.0" y="322" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600" >分配单位</text>
<text x="190" y="372" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >页变小则区内页数变多、字节数不变：8KB → 128 页，4KB → 256 页</text>
<rect x="190" y="392" width="190" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="285.0" y="420.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >1 个数据页</text>
<text x="285.0" y="440.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >16384 字节 = 16KB</text>
<text x="404" y="418" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >IO 的最小单位；页大小只能在初始化时定</text>
<text x="404" y="442" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改它 = 重建实例，备份与复制两端必须一致</text>
<rect x="190" y="488" width="120" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="250.0" y="516.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >1 行</text>
<text x="250.0" y="536.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >主键 + 业务列</text>
<rect x="350" y="488" width="160" height="66" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="430.0" y="516.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_TRX_ID 6B</text>
<text x="430.0" y="536.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >最近修改事务</text>
<rect x="550" y="488" width="170" height="66" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="635.0" y="516.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_ROLL_PTR 7B</text>
<text x="635.0" y="536.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >指向 undo 版本链</text>
<rect x="760" y="488" width="150" height="66" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="835.0" y="516.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_ROW_ID 6B</text>
<text x="835.0" y="536.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >仅无主键时存在</text>
<text x="190" y="592" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >三个隐藏列让每行固定多出 13 字节：1 亿行就是 1.3GB，且与业务字段无关。</text>
</svg>