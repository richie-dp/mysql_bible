<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 3-1　表空间 → 段 → 区 → 页 → 行：五级容器</text>
<text x="24" y="60" font-size="12" fill="#6b7280">分配按区、IO 按页、锁与版本按行——三个单位各自解决一个问题</text>
<rect x="50" y="96" width="110" height="34" rx="17.0" ry="17.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="105.0" y="117.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >① 表空间</text>
