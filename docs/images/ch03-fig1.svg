<text x="285.0" y="124.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >order_item.ibd</text>
<text x="285.0" y="142.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >一张表一个文件</text>
<text x="404" y="118" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >系统表空间 ibdata1 ｜ 通用表空间 ts1.ibd</text>
<text x="404" y="142" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >undo 表空间 undo_001 ｜ 临时表空间 ibtmp1</text>
<rect x="190" y="194" width="190" height="66" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="285.0" y="222.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >叶子节点段</text>
<text x="285.0" y="242.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >存全部行记录</text>
<rect x="420" y="194" width="200" height="66" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="520.0" y="222.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >非叶子节点段</text>
<text x="520.0" y="242.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >存主键 + 子页号</text>
<text x="660" y="222" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >每个索引 = 2 个段</text>
<text x="660" y="244" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >undo 走回滚段，不在 B+ 树里</text>
<text x="190" y="286" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >同一段的页尽量落在连续的区里，避免顺序扫描退化成随机 IO</text>
