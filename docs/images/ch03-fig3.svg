<text x="515" y="412" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >两页各剩一半空位：页内可复用，不能挪给别人</text>
<text x="515" y="434" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >新页与旧页物理不相邻 → 范围扫描退化为随机 IO</text>
<rect x="40" y="462" width="880" height="170" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="484" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >同样的 1000 万行，代价差在哪（按每页 100 行、行宽 150B 估算）</text>
<rect x="70" y="500" width="250" height="62" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="195.0" y="526.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >叶页数量</text>
<text x="195.0" y="546.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >≈ 10.7 万 vs ≈ 20 万</text>
<rect x="360" y="500" width="250" height="62" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="485.0" y="526.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >表空间占用</text>
<text x="485.0" y="546.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >≈ 1.6GB vs ≈ 3.0GB</text>
<rect x="650" y="500" width="240" height="62" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="770.0" y="526.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >范围扫描 IO</text>
<text x="770.0" y="546.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >顺序 vs 随机</text>
<text x="70" y="592" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >10M × 150B ÷ 0.93 ≈ 1.6GB，÷ 0.5 ≈ 3.0GB。填充率不是审美问题，是容量问题。</text>
