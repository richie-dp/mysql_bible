<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 3-3　页分裂：顺序插入只追加，随机插入对半劈</text>
<text x="24" y="60" font-size="12" fill="#6b7280">同样 1000 万行，主键顺序决定页的填充率与范围扫描的 IO 形态</text>
