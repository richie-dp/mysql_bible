<text x="70" y="346" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >已有页不搬移，利用率稳定在 15/16 ≈ 93%</text>
<text x="70" y="370" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >分裂成本：1 个新页 + 目录重排 + 1 条 redo</text>
