<text x="554" y="192" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >三个指针把环切成三段</text>
<rect x="560" y="205" width="14" height="14" rx="3" ry="3" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
<text x="584" y="217" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >已落盘（可回收）</text>
<text x="584" y="235" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >对应页已刷，checkpoint 越过即可覆盖</text>
<rect x="560" y="257" width="14" height="14" rx="3" ry="3" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
<text x="584" y="269" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >待刷脏（必须保留）</text>
<text x="584" y="287" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >页还在 Buffer Pool 里，覆盖就永久丢</text>
<rect x="560" y="309" width="14" height="14" rx="3" ry="3" fill="#475569" stroke="#475569" stroke-width="1"/>
<text x="584" y="321" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >可写区间</text>
<text x="584" y="339" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >capacity − checkpoint age</text>
<line x1="556" y1="352" x2="904" y2="352" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
<text x="556" y="374" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">write pos        = Log sequence number</text>
<text x="556" y="394" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">checkpoint       = Last checkpoint at</text>
<text x="60" y="496" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >8.0.30+：容量 = innodb_redo_log_capacity，切成 32 个文件按 LSN 顺时针循环使用</text>
