<text x="350.49048496469777" y="166.79268514455947" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="600" >pages flushed up to</text>
<text x="478.0" y="319.0" font-size="11" fill="#475569" text-anchor="start" font-weight="600" >write pos</text>
