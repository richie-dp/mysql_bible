<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 4-1　redo log 是一个环：write pos 追着 checkpoint 跑</text>
<text x="24" y="60" font-size="12" fill="#6b7280">环上的每一段对应一种状态；checkpoint 想前进，必须先把最老的脏页刷下去</text>
<circle cx="330" cy="315" r="118" fill="none" stroke="#eef2f7" stroke-width="48"/>
