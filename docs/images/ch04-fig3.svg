<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker></defs>
<rect width="960" height="720" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 4-3　checkpoint 年龄过高如何演变成 RT 抖动</text>
<text x="24" y="60" font-size="12" fill="#6b7280">这不是一条直线，是一条越转越快的正反馈回路</text>
<rect x="330" y="100" width="300" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="480.0" y="127.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >批量任务持续写入</text>
<text x="480.0" y="147.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >一次 UPDATE 只写几十到几百字节，但架不住量大</text>
<rect x="330" y="194" width="300" height="64" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="480.0" y="221.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >checkpoint age 上涨</text>
<text x="480.0" y="241.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >最老脏页之后的空间被一点点吃掉</text>
<rect x="330" y="288" width="300" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="315.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >逼近容量：age / capacity &gt; 75%</text>
<text x="480.0" y="335.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >剩余可写空间不足以撑过一次批量任务</text>
<rect x="330" y="382" width="300" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="480.0" y="409.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >page cleaner 全力刷脏</text>
<text x="480.0" y="429.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >每轮刷多少页，受 innodb_io_capacity 约束</text>
<rect x="330" y="476" width="300" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="503.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >刷脏跟不上，用户线程接手</text>
<text x="480.0" y="523.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >Single Page Flush：同步刷一页才能腾位置</text>
<rect x="330" y="570" width="300" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="597.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >RT 抖动，连接堆积</text>
<text x="480.0" y="617.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >CPU 不高、磁盘 util 不高，P99 却翻十倍</text>
<path d="M 480.0,164.0 L 480.0,194.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 480.0,258.0 L 480.0,288.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 480.0,352.0 L 480.0,382.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 480.0,446.0 L 480.0,476.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 480.0,540.0 L 480.0,570.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 630.0,602.0 L 700.0,602.0 L 700.0,132.0 L 632.0,132.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#m_e_dc2626)"/>
<text x="710" y="368" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600" >反馈回路</text>
<text x="710" y="386" font-size="10" fill="#dc2626" text-anchor="start" font-weight="400" >越慢 → redo 越多</text>
<text x="710" y="402" font-size="10" fill="#dc2626" text-anchor="start" font-weight="400" >→ 越慢</text>
<text x="310" y="500" font-size="10" fill="#6b7280" text-anchor="end" font-weight="600" >为什么 CPU 不高？</text>
<text x="310" y="518" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400" >线程在等 IO，不在算</text>
<text x="310" y="594" font-size="10" fill="#6b7280" text-anchor="end" font-weight="600" >为什么磁盘也不高？</text>
<text x="310" y="612" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400" >同步小 IO，队列深度上不去</text>
<path d="M 760 96 L 786 96" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="793" y="100" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >正常推进</text>
<path d="M 760 116 L 786 116" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="793" y="120" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >压力积累</text>
<path d="M 760 136 L 786 136" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="793" y="140" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >阻塞 / 风险</text>
<path d="M 760 156 L 786 156" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#m_e_dc2626)"/>
<text x="793" y="160" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >反馈回路</text>
<text x="60" y="662" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >稳态条件：刷脏速率 ≥ 脏页产生速率。容量只决定「还有多久爆炸」，不改变这个斜率。</text>
<text x="60" y="686" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >扩容量买到的是处置窗口，不是豁免权。</text>
</svg>