<text x="631.0" y="340.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="500" >回溯</text>
<path d="M 356.0,348.0 L 306.0,348.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
<rect x="317.0" y="330.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="331.0" y="340.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="500" >回溯</text>
<text x="56" y="424" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >记录头里的 trx_id 决定「这个版本能不能给我看」，记录体的前镜像决定「拼出来的旧值是多少」</text>
<text x="40" y="472" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >链长 = 这行被改过多少次且还没被 purge；走 N 步才能读到第 N 个旧版本——长事务拖慢查询，物理上就是这么发生的。</text>
<path d="M 60 508 L 86 508" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="93" y="512" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >update undo 记录</text>
<path d="M 60 528 L 86 528" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="93" y="532" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >当前版本（数据页）</text>
<path d="M 60 548 L 86 548" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#m_e_475569)"/>
<text x="93" y="552" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >DB_ROLL_PTR 指针</text>
</svg>