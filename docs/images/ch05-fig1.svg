<text x="805.0" y="139.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_ROLL_PTR</text>
<text x="805.0" y="159.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >rseg 7 / page 5 / off 112</text>
<path d="M 805.0,176.0 L 805.0,298.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5,4" marker-end="url(#m_e_475569)"/>
<rect x="744.7" y="231.0" width="55.3" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="797.0" y="241.0" font-size="11" fill="#475569" text-anchor="end" font-weight="500" >roll_ptr</text>
<rect x="40" y="250" width="880" height="190" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="272" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >undo 表空间 undo_001 · 同一行的历史版本（全部是 update undo）</text>
<rect x="56" y="300" width="250" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="181.0" y="343.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >undo 记录 v0</text>
<text x="181.0" y="363.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >trx 901 · 链的末端</text>
<text x="181" y="383" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">roll_ptr = NULL</text>
