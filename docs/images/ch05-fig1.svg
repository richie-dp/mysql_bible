<text x="481" y="383" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">roll_ptr → v0</text>
<rect x="656" y="300" width="250" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="781.0" y="343.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >undo 记录 v2</text>
<text x="781.0" y="363.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >trx 905 · status 前镜像</text>
<text x="781" y="383" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">roll_ptr → v1</text>
<path d="M 656.0,348.0 L 606.0,348.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
