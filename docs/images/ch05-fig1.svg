<rect width="960" height="580" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 5-1　一行记录的版本链：当前行 → undo v2 → v1 → v0</text>
<text x="24" y="60" font-size="12" fill="#6b7280">DB_ROLL_PTR 指向 undo 页里的物理位置；undo 只存被改列的前镜像，旧版本是「走一步、拼一次」拼出来的</text>
