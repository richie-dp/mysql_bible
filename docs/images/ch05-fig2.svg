<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 5-2　history list 与 purge 边界：谁挡住了回收</text>
<text x="24" y="60" font-size="12" fill="#6b7280">purge 只认最老的那个 ReadView；一个两小时前的只读快照，就能让上千万条 undo 原地罚站</text>
<rect x="48" y="84" width="340" height="52" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="218.0" y="105.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >ReadView A：财务报表事务，开了 2 小时</text>
<text x="218.0" y="125.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >up_limit_id = 903 —— 最老的那个</text>
<rect x="480" y="84" width="380" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
