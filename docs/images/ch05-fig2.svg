<text x="72" y="373" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400" >SHOW ENGINE INNODB STATUS</text>
<text x="72" y="394" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">------------</text>
<text x="72" y="411" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">TRANSACTIONS</text>
