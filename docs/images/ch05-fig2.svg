<text x="72" y="462" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">Purge done for trx&#x27;s n:o &lt; 4211003</text>
<text x="520" y="370" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >八位数 = 上千万条 undo 在等一个读者</text>
<text x="520" y="396" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >purge 一直在跑，只是水位一步没动</text>
<text x="520" y="422" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >同一个回滚段只能串行清，加线程也没用</text>
<text x="520" y="448" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >积压按小时计才能清完，不会因为停止写入归零</text>
<text x="60" y="504" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >水位由「最老的读者」决定，不由「最新的写入」决定——这是本章唯一需要背下来的因果。</text>
<path d="M 60 532 L 86 532" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="93" y="536" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >update undo 记录</text>
<path d="M 60 552 L 86 552" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="93" y="556" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >可被 purge 回收</text>
<path d="M 60 572 L 86 572" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="93" y="576" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >被最老视图钉住</text>
