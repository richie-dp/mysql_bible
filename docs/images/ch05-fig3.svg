<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 5-3　insert undo 与 update undo：同一个提交动作，两种归宿</text>
<text x="24" y="60" font-size="12" fill="#6b7280">提交只结束「回滚」这个用途；「让别人看见旧版本」这个用途，要等到没有读者为止</text>
<rect x="40" y="84" width="880" height="120" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >INSERT —— 回滚需要它，读的人不需要它</text>
<rect x="60" y="124" width="190" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="155.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >INSERT 一行</text>
<text x="155.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >新记录只对本事务可见</text>
<rect x="290" y="124" width="190" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="385.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >insert undo</text>
<text x="385.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >只存前镜像，不进版本链</text>
<rect x="520" y="124" width="190" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="615.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >COMMIT</text>
<text x="615.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >回滚用途到此为止</text>
<rect x="750" y="124" width="160" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="830.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >立即丢弃</text>
<text x="830.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >undo slot 马上复用</text>
<path d="M 250.0,152.0 L 290.0,152.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 480.0,152.0 L 520.0,152.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 710.0,152.0 L 750.0,152.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="40" y="250" width="880" height="130" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="272" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >UPDATE / DELETE —— 提交之后还得留着，因为别人还要看</text>
<rect x="60" y="292" width="190" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="155.0" y="315.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >UPDATE 一行</text>
<text x="155.0" y="335.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >旧值被替换掉</text>
<rect x="290" y="292" width="190" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="385.0" y="315.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >update undo</text>
<text x="385.0" y="335.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >前镜像 + 列位图 + trx_id</text>
<rect x="520" y="292" width="190" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="615.0" y="315.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >COMMIT 进 history list</text>
<text x="615.0" y="335.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >不能丢，读者可能还要</text>
<rect x="750" y="292" width="160" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="830.0" y="315.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >purge 才释放</text>
<text x="830.0" y="335.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >边界见 5.6</text>
<path d="M 250.0,320.0 L 290.0,320.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 480.0,320.0 L 520.0,320.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
<path d="M 710.0,320.0 L 750.0,320.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="40" y="410" width="880" height="120" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="432" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >DELETE 走的是 update undo，动的是删除位</text>
<rect x="60" y="450" width="230" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="175.0" y="473.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DELETE 一行</text>
<text x="175.0" y="493.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >不移动记录、不改数据</text>
<rect x="330" y="450" width="250" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="455.0" y="473.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >打 delete-mark</text>
<text x="455.0" y="493.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >info_bits 置删除位，行仍在各索引里</text>
<rect x="620" y="450" width="260" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="750.0" y="473.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >purge 才物理删除</text>
<text x="750.0" y="493.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >先每个二级索引，再聚簇索引</text>
<path d="M 290.0,478.0 L 330.0,478.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
<path d="M 580.0,478.0 L 620.0,478.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<path d="M 60 550 L 86 550" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="93" y="554" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >正常流转</text>
<path d="M 60 570 L 86 570" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="93" y="574" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >undo 的生命周期</text>
<path d="M 60 590 L 86 590" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="93" y="594" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >空间真正释放</text>
<path d="M 60 610 L 86 610" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="93" y="614" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >被读者挡住</text>
</svg>