<rect width="960" height="620" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 6-2　组提交的三阶段：N 个事务，一次 fsync</text>
<text x="24" y="60" font-size="12" fill="#6b7280">三个阶段各有一条队列，队首线程当 leader，替全组干活；流水线可以重叠推进</text>
<rect x="60" y="110" width="230" height="244" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="132" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >① flush 阶段</text>
<rect x="85" y="150" width="180" height="36" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="175.0" y="163.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Txn #1</text>
<text x="175.0" y="183.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >队首：本阶段 leader</text>
<rect x="85" y="194" width="180" height="36" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="175.0" y="207.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Txn #2</text>
<text x="175.0" y="227.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >同组：等 leader 完成</text>
<rect x="85" y="238" width="180" height="36" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="175.0" y="251.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Txn #3</text>
<text x="175.0" y="271.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >同组：等 leader 完成</text>
<rect x="85" y="282" width="180" height="36" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="175.0" y="295.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Txn #4</text>
<text x="175.0" y="315.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >同组：等 leader 完成</text>
<rect x="365" y="110" width="230" height="244" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="379" y="132" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >② sync 阶段</text>
<rect x="390" y="150" width="180" height="36" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="480.0" y="163.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Txn #1</text>
<text x="480.0" y="183.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >队首：本阶段 leader</text>
<rect x="390" y="194" width="180" height="36" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480.0" y="207.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Txn #2</text>
<text x="480.0" y="227.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >同组：等 leader 完成</text>
