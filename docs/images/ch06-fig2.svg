<text x="785.0" y="315.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >同组：等 leader 完成</text>
<path d="M 290.0,168.0 L 365.0,168.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 595.0,168.0 L 670.0,168.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<text x="175" y="378" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >write() 进 page cache</text>
<text x="480" y="378" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >fsync 落盘，全组只付一次</text>
<text x="785" y="378" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >释放行锁，返回客户端</text>
<text x="60" y="398" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >队首线程成为该阶段的 leader；三个阶段各自独立选 leader，不一定是同一个事务。</text>
<rect x="60" y="418" width="840" height="142" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="440" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >同一个组，两个方向的效果</text>
<rect x="80" y="452" width="380" height="60" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="270.0" y="477.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >收益：fsync 次数 ÷ 组大小</text>
<text x="270.0" y="497.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >10 个事务从 10 次 fsync 变成 1 次</text>
<rect x="500" y="452" width="380" height="60" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="690.0" y="477.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >代价：最后一个事务多等 ≤ sync_delay</text>
<text x="690.0" y="497.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >行锁也同步多持有这么久</text>
<text x="80" y="532" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >sync_delay = 0 时，组大小由并发自然决定；并发低时组里只有 1 个事务，等于没攒批。</text>
<path d="M 60 572 L 86 572" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="93" y="576" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >本阶段 leader</text>
<path d="M 60 592 L 86 592" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="93" y="596" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >同组 follower</text>
</svg>