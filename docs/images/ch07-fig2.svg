<text x="196" y="138" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >① 分析：从 checkpoint 扫到日志尾，重建脏页表与活跃事务表</text>
<rect x="320" y="172" width="480" height="34" rx="6" ry="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="336" y="194" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >② 重做：从最老脏页 LSN 前滚到日志尾，按 page LSN 幂等</text>
<rect x="320" y="228" width="480" height="34" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="336" y="250" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >③ 回滚：用 undo 逆序撤销未提交事务</text>
<path d="M 790.0,276.0 L 340.0,276.0" fill="none" stroke="#ea580c" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
<rect x="479.3" y="284.0" width="171.4" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="565.0" y="294.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="500" >undo 逆序回放，LSN 本身不回退</text>
<path d="M 80.0,320.0 L 890.0,320.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
