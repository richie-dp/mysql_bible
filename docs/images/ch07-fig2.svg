<text x="320" y="368" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >重做起点</text>
<line x1="800" y1="310" x2="800" y2="330" stroke="#475569" stroke-width="1.5"/>
<circle cx="800" cy="320" r="5.5" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="800" y="350" font-size="11" fill="#475569" text-anchor="middle" font-weight="600" >日志尾（最新 LSN）</text>
<text x="800" y="368" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >前滚终点</text>
<rect x="40" y="440" width="880" height="130" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="462" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >三者分工：页完整 / 改动不丢 / 没提交的不算</text>
<rect x="60" y="486" width="250" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="185.0" y="513.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >doublewrite</text>
<text x="185.0" y="533.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >保证「页是完整的」</text>
<rect x="355" y="486" width="250" height="64" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="480.0" y="513.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >redo log</text>
<text x="480.0" y="533.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >保证「修改不丢」</text>
<rect x="650" y="486" width="250" height="64" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="775.0" y="513.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >undo log</text>
<text x="775.0" y="533.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >保证「没提交的不算」</text>
<path d="M 60 592 L 86 592" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="93" y="596" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >分析</text>
<path d="M 60 612 L 86 612" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="93" y="616" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >重做（前滚）</text>
<path d="M 60 632 L 86 632" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="93" y="636" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >回滚（undo 逆序）</text>
<path d="M 60 652 L 86 652" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="93" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >页的完整性</text>
