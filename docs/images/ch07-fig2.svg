<rect width="960" height="680" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 7-2　恢复三阶段在 LSN 轴上的位置</text>
<text x="24" y="60" font-size="12" fill="#6b7280">分析决定从哪开始，重做把日志前滚到最新 LSN，回滚用 undo 把没提交的事务逆序撤销</text>
<rect x="40" y="78" width="880" height="340" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="100" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >三个阶段的起止点都落在 LSN 轴上</text>
