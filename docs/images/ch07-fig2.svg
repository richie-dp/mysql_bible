<text x="180" y="368" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >分析起点</text>
<line x1="320" y1="310" x2="320" y2="330" stroke="#ea580c" stroke-width="1.5"/>
<circle cx="320" cy="320" r="5.5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
