<text x="60" y="598" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >层 3：1 个根页把全部键切成 ≈1000 段；整层只有 1 页，常驻 Buffer Pool。</text>
<text x="60" y="620" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >层 2：≈1000 个非叶子页切成 ≈100 万段，合计约 15MB，基本可以整层缓存。</text>
<text x="60" y="642" font-size="12" fill="#16a34a" text-anchor="start" font-weight="400" >层 1：≈100 万个叶子页 × 75 行 ≈ 7500 万行——点查真正读盘的只有这一层。</text>
