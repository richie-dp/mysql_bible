<text x="55" y="278" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >已有页一条都不搬：新记录塞不下时，从空闲区取一个新页接在后面，原页保持 15/16 满。</text>
<text x="55" y="302" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >填充率长期稳定在 93% 左右；一页 81 行 → 实际约 76 行/页。</text>
<text x="55" y="324" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >代价写在另一头：所有并发写都打在最右一页的 latch 上（第 3.6 节）。</text>
