<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 8-3　自增主键与 UUID 主键：同一批数据，两种页形态</text>
<text x="24" y="60" font-size="12" fill="#6b7280">行宽按 200B、叶页可用 16256B 估算，一页满装约 81 行</text>
