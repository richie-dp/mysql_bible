<text x="55" y="580" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >新页从 free extent 取，物理上不和原页相邻 → 范围扫描从顺序 IO 退化成随机 IO。</text>
<text x="55" y="604" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >1 亿行 × 200B：填充 94% ≈ 130 万叶页 / 21GB；填充 50% ≈ 250 万叶页 / 41GB。</text>
