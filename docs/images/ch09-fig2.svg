<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_0d9488" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 9-2　ICP：把能判的先判掉，再决定回不回表</text>
<text x="24" y="60" font-size="12" fill="#6b7280">数量级为示意：候选 1000 条、最终命中 10 条；实际行数由数据分布决定</text>
<rect x="40" y="84" width="880" height="200" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >① 关闭 ICP：过滤发生在 Server 层</text>
<rect x="60" y="146" width="136" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="128.0" y="173.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >索引范围扫描</text>
<text x="128.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >候选 1000 条</text>
<path d="M 196.0,178.0 L 236.0,178.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="236" y="146" width="136" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="304.0" y="173.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >逐条回表</text>
<text x="304.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >1000 次下降</text>
<path d="M 372.0,178.0 L 412.0,178.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="412" y="146" width="136" height="64" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480.0" y="173.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Server 层过滤</text>
<text x="480.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >c 条件再判一遍</text>
<path d="M 548.0,178.0 L 588.0,178.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="588" y="146" width="136" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="656.0" y="173.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >丢弃 990 条</text>
<text x="656.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >过路费已付</text>
<path d="M 724.0,178.0 L 764.0,178.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="764" y="146" width="136" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="832.0" y="173.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >返回 10 条</text>
<text x="832.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >结果集</text>
<text x="60" y="252" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="400" >代价：1000 次回表 —— 每一次都是一遍从根到叶的 B+ 树下降，只为留下 10 行。</text>
<rect x="40" y="312" width="880" height="200" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="334" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >② 开启 ICP：只依赖索引列的条件，在叶子页上就判完</text>
<rect x="60" y="374" width="136" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="128.0" y="401.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >索引范围扫描</text>
<text x="128.0" y="421.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >候选 1000 条</text>
<path d="M 196.0,406.0 L 236.0,406.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="236" y="374" width="136" height="64" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="304.0" y="401.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >引擎内过滤</text>
<text x="304.0" y="421.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >c 条件就地判</text>
<path d="M 372.0,406.0 L 412.0,406.0" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_0d9488)"/>
<rect x="412" y="374" width="136" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="480.0" y="401.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >满足者才回表</text>
<text x="480.0" y="421.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >10 次下降</text>
<path d="M 548.0,406.0 L 588.0,406.0" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="588" y="374" width="136" height="64" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="656.0" y="401.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Server 层</text>
<text x="656.0" y="421.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >条件已判完，直接返回</text>
<path d="M 724.0,406.0 L 764.0,406.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="764" y="374" width="136" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="832.0" y="401.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >返回 10 条</text>
<text x="832.0" y="421.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >结果集</text>
<text x="60" y="480" font-size="11.5" fill="#16a34a" text-anchor="start" font-weight="400" >代价：1000 次索引项比较 + 10 次回表。回表次数从 1000 降到 10，扫的索引项一条没少。</text>
<rect x="40" y="540" width="880" height="84" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="60" y="574" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >为什么能省：回表 = 一次 B+ 树下降 + 一次页内定位，比「在索引页里比一个值」贵一到两个数量级。</text>
<text x="60" y="598" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >什么时候不管用：条件引用了索引之外的列、子查询、存储函数，或对象本来就是聚簇索引（叶子即整行，没有回表可省）。</text>
</svg>