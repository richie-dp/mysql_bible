<text x="54" y="508" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >这张图怎么用</text>
<text x="60" y="538" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >从左往右读，是排查顺序：先看两侧类型（能不能直接比对），再看列有没有被包住，再看索引结构撑不撑得起这条条件，</text>
<text x="60" y="562" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >最后才怀疑优化器与统计信息——前两类改 SQL 或改表结构，后三类多半要改索引、补 ANALYZE，或者干脆接受全表扫更便宜。</text>
<text x="60" y="592" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >红线：改完必须用 EXPLAIN 复核 key 与 rows，不能靠「应该走索引了」判断。EXPLAIN ANALYZE [8.0.18+] 能看到实际行数。</text>
