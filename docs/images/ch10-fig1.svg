<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="720" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 10-1　优化器的决策链：五步，每步只依赖有限的几个数</text>
<text x="24" y="60" font-size="12" fill="#6b7280">左边是它做的事，右边是它做这件事时唯一能看到的信息；看不到的，只能靠假设</text>
<rect x="40" y="84" width="536" height="556" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >决策链（自上而下，逐层收窄）</text>
<rect x="596" y="84" width="324" height="556" rx="10" ry="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="610" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >这一步依赖的统计值</text>
<rect x="64" y="116" width="488" height="62" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="308.0" y="142.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >① 枚举候选索引</text>
<text x="308.0" y="162.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >potential_range_indexes</text>
<rect x="612" y="116" width="292" height="62" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="758.0" y="142.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >索引定义 + WHERE 的列</text>
<text x="758.0" y="162.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >只看「能不能用」，不看数据长什么样</text>
<path d="M 308.0,178.0 L 308.0,222.0" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 552.0,147.0 L 612.0,147.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4,3" marker-end="url(#m_e_475569)"/>
