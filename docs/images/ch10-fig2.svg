<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 10-2　倾斜数据下，基数与真实分布是两回事</text>
<text x="24" y="60" font-size="12" fill="#6b7280">示例：480 万行的订单表 / 2050 个商户；数值只表达量级，不是实测</text>
