<rect x="40" y="424" width="880" height="150" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="446" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >怎么读这张对应关系</text>
<text x="60" y="474" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >① 表格的行序就是树的从左到右：o 是驱动表，i 是它的内层，s 是再上一层 join 的内层。</text>
<text x="60" y="498" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >② 三行 id 都是 1，属于同一个 query block；只有派生表、子查询才会出现 id=2、3。</text>
<text x="60" y="522" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >③ rows 是单次循环的行数：i 执行 312 次、每次 3 行；s 执行 312×3=936 次、每次 1 行。</text>
<text x="60" y="546" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >④ 把每层的 rows 乘起来，才是真实的读取量——这也是 EXPLAIN 最容易骗人的地方。</text>
</svg>