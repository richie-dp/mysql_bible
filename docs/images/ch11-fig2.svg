<text x="56" y="344" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >三行 id 相同 → 同一个 query block；行序 = 嵌套顺序</text>
<text x="56" y="366" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >第一行是驱动表，后面每行按上一行的每一行执行一次</text>
<rect x="580" y="88" width="340" height="320" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="594" y="110" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >执行树（左深嵌套循环）</text>
