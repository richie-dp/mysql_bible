<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker></defs>
<rect width="960" height="790" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 12-1　同一组表，三种连法：扫描次数差三个数量级</text>
<text x="24" y="60" font-size="12" fill="#6b7280">示意规模：orders 过滤后 30 万行作驱动侧，order_item 1200 万行；数字用来比较量级，不是实测值</text>
<rect x="40" y="84" width="880" height="212" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >① NLJ（Simple Nested Loop）—— 教科书基线，MySQL 里只有关掉 block_nested_loop 才会走到</text>
<rect x="66" y="138" width="200" height="62" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="166.0" y="164.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >orders（驱动）</text>
<text x="166.0" y="184.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >过滤后 30 万行</text>
<rect x="420" y="138" width="230" height="62" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="535.0" y="164.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >order_item（被驱动）</text>
<text x="535.0" y="184.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >连接列无可用索引</text>
<path d="M 270.0,154.0 L 416.0,154.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="286.8" y="136.0" width="112.5" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="343.0" y="146.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >取 1 行，整表扫一遍</text>
<path d="M 416.0,186.0 L 270.0,186.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="312.5" y="168.0" width="61.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="343.0" y="178.0" font-size="11" fill="#475569" text-anchor="middle" font-weight="500" >命中则输出</text>
<text x="66" y="228" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >被驱动表扫描 30 万次 × 1200 万行——这个量级没有讨论价值，所以 MySQL 默认不会走它。</text>
<text x="66" y="252" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >它的唯一用途是作为成本基线：所有「更快」的说法，都是相对它省掉了哪些次数的扫描。</text>
<text x="66" y="276" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >注意：Extra 里不会出现任何标记，因为没有 join buffer，也没有索引——只剩全表扫。</text>
<rect x="40" y="316" width="880" height="212" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="338" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >② INLJ（Index Nested Loop）—— 被驱动表的连接列有索引，这是 OLTP 唯一想要的路</text>
<rect x="66" y="370" width="200" height="62" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="166.0" y="396.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >orders（驱动）</text>
<text x="166.0" y="416.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >过滤后 30 万行</text>
<rect x="420" y="370" width="230" height="62" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="535.0" y="396.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >order_item</text>
<text x="535.0" y="416.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >PRIMARY (order_id)</text>
<path d="M 270.0,386.0 L 416.0,386.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="289.2" y="368.0" width="107.6" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="343.0" y="378.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500" >每行一次 B+ 树下降</text>
<path d="M 416.0,418.0 L 270.0,418.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="312.5" y="400.0" width="61.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="343.0" y="410.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500" >回表取整行</text>
<text x="66" y="460" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >代价 ≈ N × 单次查找成本：30 万次索引下降 + 30 万次回表，全部是随机 IO。</text>
<text x="66" y="484" font-size="12" fill="#16a34a" text-anchor="start" font-weight="400" >把 join 之后要用的列塞进被驱动表的联合索引，回表次数直接归零——这是 join 优化最高性价比的一刀。</text>
<text x="66" y="508" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >Extra 里看不出 INLJ；看被驱动表那一行的 type：eq_ref / ref / range 就是它。</text>
<rect x="40" y="548" width="880" height="212" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="570" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >③ BNL（Block Nested Loop）—— 无索引时攒批扫，join_buffer_size 决定要扫几轮</text>
<rect x="66" y="602" width="190" height="62" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="161.0" y="628.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >orders（驱动）</text>
<text x="161.0" y="648.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >30 万行</text>
<rect x="300" y="602" width="200" height="62" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="400.0" y="628.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >join buffer</text>
<text x="400.0" y="648.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >256KB，装 K 行</text>
<rect x="580" y="602" width="230" height="62" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="695.0" y="628.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >order_item（被驱动）</text>
<text x="695.0" y="648.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >每轮整表扫一遍</text>
<path d="M 260.0,633.0 L 296.0,633.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_ea580c)"/>
<rect x="264.0" y="615.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="278.0" y="625.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="500" >攒批</text>
<path d="M 504.0,633.0 L 576.0,633.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="520.5" y="615.0" width="39.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="540.0" y="625.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >顺序扫</text>
<text x="66" y="692" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >被驱动表扫描轮数 = ceil(N ÷ K)，K = join_buffer_size ÷ 单行字节数。</text>
<text x="66" y="716" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >N = 30 万、单行约 200B、buffer 256KB → K ≈ 6500，要扫 46 轮；每轮 1200 万行，合计 5 亿行以上。</text>
<text x="66" y="740" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >Extra 写 Using join buffer (Block Nested Loop)，且固定出现在被驱动表那一行——这是定位 BNL 的唯一标记。</text>
</svg>