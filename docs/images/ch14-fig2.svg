<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="620" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 14-2　GROUP BY 的临时表：从内存到磁盘的降级链</text>
<text x="24" y="60" font-size="12" fill="#6b7280">两条路径两套阈值；tmp_table_size 只卡在下面那条路上</text>
<rect x="40" y="84" width="880" height="244" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >① [8.0] 默认：internal_tmp_mem_storage_engine = TempTable</text>
<rect x="64" y="126" width="256" height="96" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="192.0" y="169.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >内存临时表</text>
<text x="192.0" y="189.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >上限 temptable_max_ram（默认 1GB）</text>
<rect x="360" y="126" width="256" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="488.0" y="169.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >溢出到 mmap 文件</text>
<text x="488.0" y="189.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >上限 temptable_max_mmap [8.0.23+]</text>
<rect x="656" y="126" width="256" height="96" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="784.0" y="169.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >InnoDB 磁盘临时表</text>
<text x="784.0" y="189.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >ibtmp1 · innodb_temp_data_file_path</text>
<path d="M 320.0,174.0 L 360.0,174.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 616.0,174.0 L 656.0,174.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<text x="64" y="262" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >RAM 用尽不直接落盘：先申请内存映射的临时文件，两者都超限才把这张表转成 InnoDB 表。</text>
<rect x="40" y="368" width="880" height="150" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="390" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >② [5.7] 或 internal_tmp_mem_storage_engine = MEMORY：MEMORY 引擎临时表</text>
<rect x="64" y="408" width="300" height="76" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="214.0" y="441.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >MEMORY 内存临时表</text>
<text x="214.0" y="461.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >上限 min(tmp_table_size, max_heap_table_size)</text>
<rect x="464" y="408" width="300" height="76" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="614.0" y="441.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >InnoDB 磁盘临时表</text>
<text x="614.0" y="461.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >ibtmp1 · Created_tmp_disk_tables + 1</text>
<path d="M 364.0,446.0 L 464.0,446.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="400.0" y="427.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="414.0" y="437.0" font-size="11" fill="#475569" text-anchor="middle" font-weight="500" >超出</text>
<text x="64" y="506" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >tmp_table_size 卡在这里——它只对 MEMORY 引擎生效，8.0 默认配置下改它没有效果。</text>
<text x="40" y="560" font-size="11" fill="#6b7280" text-anchor="start" font-weight="600" >怎么确认自己在哪条路上：SHOW VARIABLES LIKE &#x27;internal_tmp_mem_storage_engine&#x27;；</text>
<text x="40" y="584" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >再看 Created_tmp_disk_tables ÷ Created_tmp_tables——比值低说明全在内存，比值高才需要调阈值。</text>
</svg>