<text x="60" y="676" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >四类病灶互斥地对应四种改法：补索引 / 减行数 / 去排序 / 缩事务。一条 SQL 可以同时命中两类，但一次只能治一类。</text>
