<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 16-2　一个事务的时间线：资源是什么时候被占上的</text>
<text x="24" y="60" font-size="12" fill="#6b7280">BEGIN 只改会话状态；trx_id、undo slot、行锁、ReadView 各有各的出现时机</text>
<rect x="60" y="104" width="140" height="66" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="130.0" y="132.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >BEGIN</text>
<text x="130.0" y="152.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >只改会话状态</text>
<rect x="243" y="104" width="160" height="66" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="323.0" y="132.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >第一条写语句</text>
<text x="323.0" y="152.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >才分配 trx_id</text>
<path d="M 200.0,137.0 L 243.0,137.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="446" y="104" width="160" height="66" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="526.0" y="132.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >写 undo / redo</text>
<text x="526.0" y="152.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >数据页变脏，锁在手里</text>
<path d="M 403.0,137.0 L 446.0,137.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="649" y="104" width="120" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="709.0" y="132.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >COMMIT</text>
<text x="709.0" y="152.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >redo 落盘，放锁</text>
<path d="M 606.0,137.0 L 649.0,137.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="809" y="104" width="90" height="66" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="854.0" y="132.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >purge</text>
<text x="854.0" y="152.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >回收 undo</text>
<path d="M 769.0,137.0 L 809.0,137.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="60" y="196" width="840" height="56" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="74" y="220" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">trx_id</text>
<text x="74" y="239" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >只读事务 8.0 不分配</text>
<rect x="243" y="210" width="406" height="28" rx="6" ry="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="253" y="229" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="500" >trx_id 从第一条写语句活到 COMMIT</text>
<rect x="60" y="266" width="840" height="56" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="74" y="290" font-size="12" fill="#ea580c" text-anchor="start" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">undo</text>
<text x="74" y="309" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >写操作才会产生</text>
<rect x="243" y="280" width="647" height="28" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="253" y="299" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="500" >undo slot + undo 记录，purge 清完才归还</text>
<rect x="60" y="336" width="840" height="56" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="74" y="360" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">row lock</text>
<text x="74" y="379" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >X / Next-Key</text>
<rect x="243" y="350" width="406" height="28" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="253" y="369" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="500" >X 记录锁，持有到事务结束</text>
<rect x="60" y="406" width="840" height="56" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="74" y="430" font-size="12" fill="#9333ea" text-anchor="start" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">ReadView</text>
<text x="74" y="449" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >RR 下事务级</text>
<rect x="403" y="420" width="246" height="28" rx="6" ry="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="413" y="439" font-size="10.5" fill="#9333ea" text-anchor="start" font-weight="500" >首个快照读时才创建</text>
<text x="216" y="439" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >没有快照读就不存在</text>
<text x="60" y="494" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >BEGIN 之后，连接上只有会话状态；第一条语句才建立引擎侧事务对象，第一条写语句才换来 trx_id、undo slot 和行锁。</text>
<text x="60" y="518" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >COMMIT 释放锁和 trx_id，但不释放 undo——undo 的寿命由最老的 ReadView 决定（第 5 章）。</text>
</svg>