<text x="142.5" y="337.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">creator_trx_id = 906</text>
<text x="142.5" y="357.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >等于它的版本永远可见</text>
