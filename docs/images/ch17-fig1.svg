<text x="592.5" y="337.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">max_trx_id = 910</text>
<text x="592.5" y="357.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >下一个待分配 · m_low_limit_id</text>
