<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 17-1　ReadView 的四个字段，在 trx_id 数轴和版本链上切出「能看」与「不能看」</text>
<text x="24" y="60" font-size="12" fill="#6b7280">视图由 trx 906 建立，活跃集合 m_ids = {905, 907, 909}；这一行先后被 903 / 905 / 911 / 912 改过</text>
