<line x1="580" y1="206" x2="580" y2="214" stroke="#475569" stroke-width="1.2"/>
<text x="580" y="230" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">909</text>
