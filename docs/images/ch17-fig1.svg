<text x="90" y="252" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="400" >① 已结束 → 直接可见</text>
<text x="310" y="252" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="400" >③④ 还活着 → 看在不在 m_ids</text>
<text x="660" y="252" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >⑤ 视图之后才出生 → 不可见</text>
