<text x="40" y="600" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >读到的是 v0：这一版在视图建立前就已提交，于是沿链走三步、拼三次，返回它的值。</text>
<text x="40" y="624" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >链上每一版都要过一次「六个情形」的判断——判断的是版本头的 trx_id，不是行本身。</text>
<path d="M 40 654 L 66 654" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="73" y="658" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >可见，返回这一版</text>
<path d="M 40 674 L 66 674" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="73" y="678" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >不可见，沿 DB_ROLL_PTR 回溯</text>
<path d="M 40 694 L 66 694" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#m_e_ea580c)"/>
<text x="73" y="698" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >建视图时的活跃集合 / 指针</text>
