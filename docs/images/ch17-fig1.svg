<text x="817.5" y="337.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">m_ids = {905,907,909}</text>
<text x="817.5" y="357.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >建视图时的活跃读写事务</text>
<rect x="50" y="452" width="180" height="84" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="140.0" y="489.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >当前版本</text>
<text x="140.0" y="509.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >DB_TRX_ID = 912</text>
<text x="140" y="558" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600" >不可见：912 ≥ max</text>
<rect x="270" y="452" width="180" height="84" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="360.0" y="489.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >undo v2</text>
<text x="360.0" y="509.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >由 trx 911 写入</text>
<text x="360" y="558" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600" >不可见：911 ≥ max</text>
<rect x="490" y="452" width="180" height="84" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="580.0" y="489.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >undo v1</text>
<text x="580.0" y="509.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >由 trx 905 写入</text>
<text x="580" y="558" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600" >不可见：905 在 m_ids</text>
<rect x="710" y="452" width="180" height="84" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="800.0" y="489.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >undo v0 链尾</text>
<text x="800.0" y="509.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >由 trx 903 写入</text>
<text x="800" y="558" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="600" >可见：903 &lt; min</text>
