<text x="298.0" y="504.0" font-size="11" fill="#475569" text-anchor="start" font-weight="500" >否</text>
<path d="M 460.0,150.0 L 520.0,150.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="481.5" y="132.0" width="17.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="490.0" y="142.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500" >是</text>
<rect x="520" y="118" width="400" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="720.0" y="145.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >可见　自己写的那一版</text>
<text x="720.0" y="165.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >creator 无需查 m_ids，直接放行</text>
<path d="M 460.0,290.0 L 520.0,290.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="481.5" y="272.0" width="17.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="490.0" y="282.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500" >是</text>
<rect x="520" y="258" width="400" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="720.0" y="285.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >可见　视图建立前已结束</text>
<text x="720.0" y="305.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >比 min 小 = 提交或回滚都已落定</text>
<path d="M 460.0,430.0 L 520.0,430.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
