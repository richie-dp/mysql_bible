<rect width="960" height="790" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 17-2　可见性判断的完整决策树：四个判断，六个出口</text>
<text x="24" y="60" font-size="12" fill="#6b7280">顺序不能换：先认「自己」，再认「比我老」，最后才查活跃集合——换成源码以外的顺序，结论会错</text>
<polygon points="290,105.0 460.0,150 290,195.0 120.0,150" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="290" y="154.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_TRX_ID = creator ?</text>
<polygon points="290,245.0 460.0,290 290,335.0 120.0,290" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="290" y="294.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_TRX_ID &lt; min_trx_id ?</text>
<polygon points="290,385.0 460.0,430 290,475.0 120.0,430" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="290" y="434.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_TRX_ID &gt;= max_trx_id ?</text>
<polygon points="290,525.0 460.0,570 290,615.0 120.0,570" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="290" y="574.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DB_TRX_ID 在 m_ids 中 ?</text>
