<text x="490.0" y="547.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >是</text>
<rect x="520" y="523" width="400" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="720.0" y="550.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >不可见 → 回溯</text>
<text x="720.0" y="570.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >建立视图时它还活着，可能没提交</text>
<path d="M 290.0,615.0 L 290.0,660.0 L 520.0,660.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="374.0" y="642.0" width="17.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="382.5" y="652.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500" >否</text>
<rect x="520" y="628" width="400" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="720.0" y="655.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >可见　已提交</text>
<text x="720.0" y="675.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >在 [min, max) 之间，又不在 m_ids 里</text>
<rect x="40" y="706" width="880" height="66" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="56" y="730" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="600" >走「不可见」的两条分支：读 DB_ROLL_PTR 指向的上一段 undo，用它的 trx_id 重跑这棵树。</text>
<text x="56" y="754" font-size="11" fill="#7f1d1d" text-anchor="start" font-weight="400" >走到 roll_ptr = NULL 仍不可见，或取到的版本带 delete-mark → 这行对本视图不存在。</text>
</svg>