<text x="490.0" y="422.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >是</text>
<rect x="520" y="398" width="400" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="720.0" y="425.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >不可见 → 回溯</text>
<text x="720.0" y="445.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >视图建立后才分配，肯定没提交</text>
<path d="M 460.0,555.0 L 520.0,555.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
