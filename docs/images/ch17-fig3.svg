<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker></defs>
<rect width="960" height="780" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 17-3　RR 下幻读重现：快照读看不见的行，当前读能改，改完就看得见了</text>
<text x="24" y="60" font-size="12" fill="#6b7280">三个会话，同一张 order_charge；A 的两次统计之间只加了一条 UPDATE，总额差了 370,000</text>
<rect x="80" y="84" width="280" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="220.0" y="113.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >会话 A　业务事务（RR）</text>
<line x1="220" y1="134" x2="220" y2="660" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="400" y="84" width="260" height="50" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="530.0" y="113.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >会话 B　调账写入（自动提交）</text>
<line x1="530" y1="134" x2="530" y2="660" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="700" y="84" width="220" height="50" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="810.0" y="113.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >会话 C　新连接（对照）</text>
<line x1="810" y1="134" x2="810" y2="660" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,5"/>
<path d="M 50.0,150.0 L 50.0,640.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<text x="58" y="128" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >时间</text>
<rect x="80" y="160" width="280" height="60" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="220.0" y="185.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">BEGIN; SELECT SUM(amount)</text>
<text x="220.0" y="205.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >建立 V1：99031 还不在里面</text>
<rect x="400" y="245" width="260" height="60" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="530.0" y="270.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">INSERT ... (99031, 370000); COMMIT</text>
<text x="530.0" y="290.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >一笔调账，业务上完全合法</text>
<rect x="700" y="325" width="220" height="60" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="810.0" y="350.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">SELECT * WHERE id = 99031</text>
<text x="810.0" y="370.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >1 行：数据真的在库里</text>
<rect x="80" y="405" width="280" height="60" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="220.0" y="430.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">UPDATE ... SET reconciled = 1</text>
<text x="220.0" y="450.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >当前读命中：1 row affected</text>
<rect x="80" y="490" width="280" height="60" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="220.0" y="515.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">SELECT SUM(amount)（原样重跑）</text>
<text x="220.0" y="535.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >多出 370,000：幻读出现</text>
<rect x="80" y="570" width="280" height="60" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="220.0" y="595.0" font-size="10.5" fill="#111827" text-anchor="middle" font-weight="600" >COMMIT</text>
<text x="220.0" y="615.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >释放视图，purge 水位前移</text>
<path d="M 660.0,268.0 L 680.0,268.0 L 680.0,355.0 L 700.0,355.0" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_9333ea)"/>
<rect x="80" y="288" width="280" height="84" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="100" y="314" font-size="11" fill="#6b7280" text-anchor="start" font-weight="600" >V1 存活中</text>
<text x="100" y="336" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >RR 的视图直到 COMMIT 才释放</text>
<text x="100" y="356" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >B 的提交正好落在这个窗口里</text>
<rect x="40" y="650" width="880" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="56" y="674" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600" >④ 是全章的靶心：这一行在 A 的视图里不存在，A 的当前读却必须改到它；改完它的 DB_TRX_ID 变成 A 自己，</text>
<text x="56" y="694" font-size="11" fill="#7f1d1d" text-anchor="start" font-weight="400" >可见性判断第 2 条直接放行，于是它在 ⑤ 里凭空出现——两条规则各自都对，接缝上没有不变量。</text>
<text x="40" y="732" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >C 全程只做一件事：证明这条记录确实提交了。所以 A 的「看不见」不是数据丢了，是它的视图里没有这一版。</text>
<text x="40" y="754" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >把 A 的级别改成 RC 重跑，① 和 ⑤ 的差额一样在——RC 连「两次快照读结果相同」都不保证。</text>
</svg>