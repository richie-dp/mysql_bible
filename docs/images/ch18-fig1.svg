<text x="365.0" y="415.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >表级意向标记</text>
<rect x="270" y="438" width="190" height="52" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="365.0" y="459.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >AUTO-INC</text>
<text x="365.0" y="479.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >自增计数器</text>
<path d="M 480.0,138.0 L 480.0,158.0 L 595.0,158.0 L 595.0,178.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="500" y="178" width="190" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="595.0" y="204.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >算法｜覆盖多长一段</text>
<path d="M 595.0,222.0 L 595.0,246.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="500" y="246" width="190" height="52" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="595.0" y="267.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Record</text>
<text x="595.0" y="287.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >锁住那一条记录</text>
<rect x="500" y="310" width="190" height="52" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="595.0" y="331.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Gap</text>
<text x="595.0" y="351.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >锁住它前面的空位</text>
<rect x="500" y="374" width="190" height="52" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="595.0" y="395.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >Next-Key</text>
<text x="595.0" y="415.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >记录 + 前面空位</text>
<rect x="500" y="438" width="190" height="52" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="595.0" y="459.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >谓词锁</text>
<text x="595.0" y="479.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >锁索引区间（空间）</text>
<path d="M 480.0,138.0 L 480.0,158.0 L 825.0,158.0 L 825.0,178.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="730" y="178" width="190" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="825.0" y="204.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >用途｜解决别的问题</text>
<path d="M 825.0,222.0 L 825.0,246.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="730" y="246" width="190" height="52" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="825.0" y="267.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >意向锁</text>
<text x="825.0" y="287.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >预告：我要锁行</text>
<rect x="730" y="310" width="190" height="52" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="825.0" y="331.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >插入意向</text>
<text x="825.0" y="351.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >预告：我要插这里</text>
<rect x="730" y="374" width="190" height="52" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="825.0" y="395.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >MDL</text>
<text x="825.0" y="415.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >保护表结构</text>
<rect x="730" y="438" width="190" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="825.0" y="459.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >备份锁</text>
<text x="825.0" y="479.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >保护实例不被 DDL</text>
<rect x="40" y="516" width="880" height="146" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="538" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >四个维度怎么叠在同一条语句上</text>
<text x="60" y="566" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >RR 下 UPDATE order_main SET status = 2 WHERE amount = 1000：行级 + X + Gap + 表级 IX。</text>
<text x="60" y="592" font-size="12" fill="#2563eb" text-anchor="start" font-weight="400" >换成 WHERE id = 7 且命中，算法那一维退化成 Record；换成范围条件，又变回 Next-Key——变的只是覆盖范围。</text>
<text x="60" y="618" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >页锁一列是历史：InnoDB 没有页锁，页上的 rw_lock 是 latch，不是事务锁，不进 data_locks。</text>
<text x="60" y="644" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >MDL 与备份锁在 Server 层和实例层，引擎根本不知道它们存在，但它们照样让你排队。</text>
</svg>