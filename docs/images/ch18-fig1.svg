<text x="135.0" y="267.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >全局锁</text>
<text x="135.0" y="287.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >对象：整个实例</text>
<rect x="40" y="310" width="190" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="135.0" y="331.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >表锁</text>
<text x="135.0" y="351.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >对象：整张表</text>
<rect x="40" y="374" width="190" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="135.0" y="395.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >页锁（历史）</text>
<text x="135.0" y="415.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >对象：16KB 数据页</text>
<rect x="40" y="438" width="190" height="52" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="135.0" y="459.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >行锁</text>
<text x="135.0" y="479.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >对象：索引记录</text>
<path d="M 480.0,138.0 L 480.0,158.0 L 365.0,158.0 L 365.0,178.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="270" y="178" width="190" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="365.0" y="204.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >模式｜允许谁同时进</text>
<path d="M 365.0,222.0 L 365.0,246.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="270" y="246" width="190" height="52" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="365.0" y="267.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >S 共享</text>
<text x="365.0" y="287.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >读读可并发</text>
<rect x="270" y="310" width="190" height="52" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="365.0" y="331.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >X 排他</text>
<text x="365.0" y="351.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >读写都互斥</text>
<rect x="270" y="374" width="190" height="52" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
