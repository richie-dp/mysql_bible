<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="700" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 18-1　锁的分类树：四个正交维度挂在同一批对象上</text>
<text x="24" y="60" font-size="12" fill="#6b7280">一条 UPDATE 拿到的是四个维度的一次取值组合，不是「某一种锁」</text>
<rect x="380" y="84" width="200" height="54" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="480.0" y="106.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" >InnoDB 锁</text>
<text x="480.0" y="126.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >四个维度切同一批对象</text>
<path d="M 480.0,138.0 L 480.0,158.0 L 135.0,158.0 L 135.0,178.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="40" y="178" width="190" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
