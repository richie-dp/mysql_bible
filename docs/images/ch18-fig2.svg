<text x="54" y="462" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >矩阵怎么被用：表锁只看这一张，行锁另算</text>
<text x="60" y="486" font-size="12" fill="#16a34a" text-anchor="start" font-weight="400" >① IS 与 IX 永远兼容。它们是记账不是保护：若 IX 之间互斥，同表两行并发更新就退化成表级串行。</text>
<text x="60" y="514" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >② S / X 与 IX 冲突，是因为表级锁要求整表安静；IX 说明「有人正在改行」，两者语义直接打架。</text>
<text x="60" y="542" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >③ 于是加表锁只需读这张矩阵：命中冲突就排队，不必扫描任何一行——这正是意向锁存在的理由。</text>
<text x="60" y="570" font-size="12" fill="#2563eb" text-anchor="start" font-weight="400" >④ 矩阵只解决「表锁 vs 行锁」。两把行锁是否冲突，要看它们是否落在同一索引记录或同一段间隙上。</text>
<text x="60" y="598" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >⑤ 对角线全绿：同模式之间不谈冲突；X 那一行全红，排他锁与任何请求都不共存。</text>
</svg>