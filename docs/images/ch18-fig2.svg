<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 18-2　意向锁兼容矩阵：表锁如何在不扫一行的情况下判断冲突</text>
<text x="24" y="60" font-size="12" fill="#6b7280">行 = 已持有的锁，列 = 新来的请求；绿色兼容，红色排队</text>
<rect x="40" y="108" width="164" height="200" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="130" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >假如没有意向锁</text>
<text x="52" y="152" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >给表加锁前必须确认</text>
<text x="52" y="174" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >表里没有任何行锁，</text>
<text x="52" y="196" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >只能把整张表扫一遍。</text>
<text x="52" y="226" font-size="10" fill="#dc2626" text-anchor="start" font-weight="400" >1000 万行 = 1000 万次</text>
<text x="52" y="248" font-size="10" fill="#dc2626" text-anchor="start" font-weight="400" >检查，锁表成了重操作。</text>
<text x="52" y="278" font-size="10" fill="#16a34a" text-anchor="start" font-weight="400" >IS / IX 把它变成 O(1)：</text>
<text x="52" y="296" font-size="10" fill="#16a34a" text-anchor="start" font-weight="400" >只看表上的标记。</text>
