<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker></defs>
<rect width="960" height="660" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 19-1　等值查询的三种加锁区间：命中 / 未命中 / 边界值</text>
<text x="24" y="60" font-size="12" fill="#6b7280">表 t_lock：idx_c(c)，索引值 5 / 10 / 15 / 20 / 25 / 30；区间条左端开、右端闭</text>
<rect x="40" y="96" width="880" height="104" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="118" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >idx_c 叶子记录（按 c 升序；最左是 -∞ 侧，最右是 supremum）</text>
<rect x="102" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="140.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >c=5</text>
<text x="140.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >id=1</text>
<rect x="222" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="260.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >c=10</text>
<text x="260.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >id=2</text>
<rect x="342" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >c=15</text>
<text x="380.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >id=3</text>
<rect x="462" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="500.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >c=20</text>
<text x="500.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >id=5</text>
<rect x="582" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="620.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >c=25</text>
<text x="620.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >id=6</text>
<rect x="702" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="740.0" y="147.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >c=30</text>
<text x="740.0" y="167.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >id=7</text>
<rect x="822" y="126" width="76" height="52" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="860.0" y="147.0" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >supremum</text>
<text x="860.0" y="167.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >伪记录</text>
<text x="46" y="236" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600" >① WHERE c = 15　命中</text>
<rect x="262" y="246" width="118" height="14" rx="4" ry="4" fill="#16a34a" stroke="#16a34a" stroke-width="1" opacity="0.88"/>
<path d="M 380 242 L 380 264" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 262 245 L 262 261" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="321.0" y="256.6" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" >(10,15]</text>
<rect x="380" y="246" width="120" height="14" rx="4" ry="4" fill="#dc2626" stroke="#dc2626" stroke-width="1" opacity="0.88"/>
<path d="M 500 242 L 500 264" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 380 245 L 380 261" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="440.0" y="256.6" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" >(15,20)</text>
<text x="102" y="282" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >引擎读到 15 后还要读 20 确认没有重复，于是锁住两段：记录 15 + 它右边的间隙；回表后 PRIMARY 上再加一条 X,REC_NOT_GAP。</text>
<text x="46" y="326" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600" >② WHERE c = 12　未命中（值域中间）</text>
<rect x="262" y="336" width="118" height="14" rx="4" ry="4" fill="#dc2626" stroke="#dc2626" stroke-width="1" opacity="0.88"/>
<path d="M 380 332 L 380 354" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 262 335 L 262 351" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="321.0" y="346.6" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" >(10,15)</text>
<text x="102" y="372" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >没有记录可锁，只剩间隙；LOCK_DATA 记的是间隙右边那条记录 15，而不是 12 —— 12 在索引里根本不存在。</text>
<text x="46" y="416" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600" >③ WHERE c = 30　命中最大值（边界）</text>
<rect x="622" y="426" width="118" height="14" rx="4" ry="4" fill="#16a34a" stroke="#16a34a" stroke-width="1" opacity="0.88"/>
<path d="M 740 422 L 740 444" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 622 425 L 622 441" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="681.0" y="436.6" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" >(25,30]</text>
<rect x="740" y="426" width="120" height="14" rx="4" ry="4" fill="#dc2626" stroke="#dc2626" stroke-width="1" opacity="0.88"/>
<path d="M 860 422 L 860 444" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 740 425 L 740 441" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="800.0" y="436.6" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600" >(30,+∞)</text>
<text x="102" y="462" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >右侧邻居不是记录而是 supremum，LOCK_DATA 写成 supremum pseudo-record；这一段正是新值插入的落点，冲突概率最高。</text>
<path d="M 102 492 L 128 492" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="135" y="496" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >间隙锁（不可插入）</text>
<path d="M 102 512 L 128 512" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="135" y="516" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >临键锁里的记录部分</text>
<rect x="40" y="548" width="880" height="92" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="570" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >把三种情况并起来看</text>
<text x="60" y="588" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >区间条的空隙 = 还能插入的位置；锁住一段间隙，等于封死这段范围内的所有 INSERT。</text>
<text x="60" y="610" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >等值查询的右边界永远是“第一条不相等（或 supremum）的记录”，所以命中时必然多锁一段。</text>
<text x="60" y="630" font-size="11" fill="#16a34a" text-anchor="start" font-weight="400" >唯一索引等值命中才例外：唯一性让它不必向右确认，临键锁退化成记录锁。</text>
</svg>