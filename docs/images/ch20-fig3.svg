<rect x="215.0" y="366.0" width="50.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="218.0" y="376.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="500" >重试风暴</text>
<text x="140" y="690" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >反馈回路：越不可用 → 重试越多 → 热点行越挤 → 越不可用</text>
</svg>