<text x="60" y="492" font-size="13" fill="#111827" text-anchor="start" font-weight="700" >④ 状态机推进</text>
<text x="60" y="512" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >每批推进一个状态位</text>
<text x="60" y="530" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >天然幂等，适合数据迁移</text>
<rect x="264" y="514" width="640" height="1.5" rx="0" ry="0" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<rect x="280" y="488" width="76" height="28" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="318.0" y="505.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >0→1</text>
<rect x="380" y="488" width="76" height="28" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="418.0" y="505.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >1→2</text>
<rect x="480" y="488" width="76" height="28" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="518.0" y="505.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >2→3</text>
<rect x="580" y="488" width="76" height="28" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="618.0" y="505.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >3→4</text>
<rect x="680" y="488" width="76" height="28" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="718.0" y="505.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >4→5</text>
<rect x="800" y="486" width="110" height="24" rx="12.0" ry="12.0" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="855.0" y="501.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >失败可重跑</text>
<text x="800" y="528" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" >同一状态不重复处理</text>
<rect x="40" y="584" width="880" height="92" rx="10" ry="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="610" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700" >分批大小不是拍 500 或 1000，是从三个上限反推</text>
<text x="60" y="634" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">B = B0 × (t_budget / t0)      t_budget = min(innodb_lock_wait_timeout × 0.1, 应用超时, T / 批次数 − 批间停顿)</text>
<text x="60" y="656" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >先跑一批 B0 量出 t0；批次数 = ceil(N / B)；批间停顿要让从库回放跟得上。</text>
</svg>