<text x="60" y="252" font-size="13" fill="#111827" text-anchor="start" font-weight="700" >② 按时间窗口</text>
<text x="60" y="272" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >WHERE create_time &gt;= ? AND &lt; ?</text>
<text x="60" y="290" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >前提：有索引，历史不再变</text>
<rect x="264" y="274" width="640" height="1.5" rx="0" ry="0" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<text x="280" y="240" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" >每天行数不同，批次宽度也不同</text>
