<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 21-2　同一份 300 万行，四种切法：时间轴与资源形态</text>
<text x="24" y="60" font-size="12" fill="#6b7280">目标都是 4 小时跑完；差别在「每批是否可独立提交」和「前提条件是否成立」</text>
<text x="40" y="86" font-size="11" fill="#6b7280" text-anchor="start" font-weight="500" >同一份 300 万行 · 同一个 4 小时窗口 · 同一个主库</text>
<rect x="40" y="104" width="880" height="1.2" rx="0" ry="0" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<rect x="40" y="184" width="880" height="1.2" rx="0" ry="0" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
