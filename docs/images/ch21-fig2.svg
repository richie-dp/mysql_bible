<text x="60" y="392" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >写任务表 + 消费者分批</text>
<text x="60" y="410" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >代价：最终一致，消费要幂等</text>
