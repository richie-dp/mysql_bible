<text x="60" y="132" font-size="13" fill="#111827" text-anchor="start" font-weight="700" >① 按主键区间</text>
<text x="60" y="152" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >WHERE id BETWEEN ? AND ?</text>
<text x="60" y="170" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >前提：主键单调，UUID 失效</text>
<rect x="264" y="154" width="640" height="1.5" rx="0" ry="0" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<text x="280" y="120" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" >id 升序，每批 50 万</text>
