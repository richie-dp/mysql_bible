<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker></defs>
<rect width="960" height="660" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 22-1　一条事务从主库 binlog 到从库数据页的落盘路径</text>
<text x="24" y="60" font-size="12" fill="#6b7280">默认配置下 ①③④ 串在关键路径上，② 被 sync_relay_log 摊薄——延迟下限由此而来</text>
<rect x="50" y="86" width="860" height="140" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="108" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >主库 source</text>
<rect x="70" y="118" width="240" height="60" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="190.0" y="143.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >binlog cache</text>
<text x="190.0" y="163.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >内存 · 事务执行中攒批</text>
<rect x="350" y="118" width="240" height="60" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="470.0" y="143.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >binlog 文件</text>
<text x="470.0" y="163.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >① fsync · sync_binlog=1</text>
<rect x="630" y="118" width="240" height="60" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="750.0" y="143.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >dump thread</text>
<text x="750.0" y="163.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >按从库要的坐标读文件</text>
<path d="M 310.0,148.0 L 350.0,148.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 590.0,148.0 L 630.0,148.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="362" y="96" width="50.32" height="20" rx="10" ry="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
<text x="387.16" y="110" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600" >① 落盘</text>
<text x="52" y="262" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >网络（TCP）：从库要什么，主库就从哪读，单向推送</text>
<path d="M 820.0,178.0 L 820.0,250.0 L 820.0,330.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5,4" marker-end="url(#m_e_475569)"/>
<rect x="776.0" y="255.6" width="39.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="812.0" y="265.6" font-size="11" fill="#475569" text-anchor="end" font-weight="500" >事件流</text>
<rect x="50" y="290" width="860" height="150" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="312" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >从库 replica</text>
<rect x="730" y="330" width="180" height="60" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="820.0" y="355.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >relay log</text>
<text x="820.0" y="375.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >② sync_relay_log=10000</text>
<rect x="510" y="330" width="180" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="600.0" y="355.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >applier 线程</text>
<text x="600.0" y="375.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >③ 写从库 binlog</text>
<rect x="290" y="330" width="180" height="60" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="380.0" y="355.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >redo log</text>
<text x="380.0" y="375.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >④ ftc=1 · 每事务</text>
<rect x="70" y="330" width="180" height="60" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="160.0" y="355.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >数据页</text>
<text x="160.0" y="375.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >脏页异步刷盘</text>
<path d="M 730.0,360.0 L 690.0,360.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 510.0,360.0 L 470.0,360.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 290.0,360.0 L 250.0,360.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="742" y="308" width="50.32" height="20" rx="10" ry="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="767.16" y="322" font-size="11" fill="#475569" text-anchor="middle" font-weight="600" >② 落盘</text>
<rect x="522" y="308" width="50.32" height="20" rx="10" ry="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
<text x="547.16" y="322" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600" >③ 落盘</text>
<rect x="302" y="308" width="50.32" height="20" rx="10" ry="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
<text x="327.16" y="322" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600" >④ 落盘</text>
<text x="52" y="466" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >①③④ 在关键路径上：客户端、从库的提交都要等它们返回；② 不在——receiver 写完就继续收下一个事件。</text>
<text x="52" y="488" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >relay log 是可丢弃的中间态（崩溃后整段扔掉重拉），所以不必为它付每事务一次的持久化代价。</text>
<rect x="50" y="510" width="860" height="96" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="532" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >同一条事务在整条链路上的 fsync 次数</text>
<rect x="70" y="546" width="250" height="48" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="195.0" y="565.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >默认：3 次</text>
<text x="195.0" y="585.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >①③④，②被摊薄</text>
<rect x="360" y="546" width="250" height="48" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="485.0" y="565.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >关 log_replica_updates：2 次</text>
<text x="485.0" y="585.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >从库不能再当源</text>
<rect x="650" y="546" width="250" height="48" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="775.0" y="565.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >sync_relay_log=1：4 次</text>
<text x="775.0" y="585.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >多一次 fdatasync</text>
<path d="M 52 626 L 78 626" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="85" y="630" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >fsync 落盘，在关键路径上</text>
<path d="M 52 646 L 78 646" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#m_e_475569)"/>
<text x="85" y="650" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >落盘但不在关键路径上</text>
</svg>