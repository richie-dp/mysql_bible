<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker></defs>
<rect width="960" height="680" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 23-1　gtid_executed / gtid_purged / gtid_owned 的包含关系</text>
<text x="24" y="60" font-size="12" fill="#6b7280">purged 恒为 executed 的子集；从库要的 GTID 落在 purged 区间，就是 1236</text>
<rect x="50" y="84" width="520" height="348" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >gtid_executed　「我有什么」</text>
<rect x="70" y="122" width="480" height="126" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="86" y="148" font-size="13" fill="#9333ea" text-anchor="start" font-weight="600" >gtid_purged　「我丢了什么」</text>
<text x="86" y="176" font-size="12" fill="#111827" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">3e11c4a2-…:1 – 3e11c4a2-…:88420</text>
<text x="86" y="200" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >这 88420 个事务的 binlog 已经被删掉</text>
<text x="86" y="224" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >集合里还留着名字，内容已经发不出来</text>
<rect x="70" y="262" width="480" height="62" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="310.0" y="288.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >3e11c4a2-…:88421 – :90233</text>
<text x="310.0" y="308.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >binlog 还在：差集能按事务发给从库</text>
<text x="70" y="352" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >purged ⊂ executed，单调增长，不会变小</text>
<text x="70" y="376" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >PURGE BINARY LOGS、binlog 过期、导入 dump 都会推高它</text>
<text x="70" y="404" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >从库要的 GTID 落在上面那一段 → 主库拿不出内容 → 1236</text>
<rect x="620" y="122" width="290" height="78" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="765.0" y="156.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >从库的请求</text>
<text x="765.0" y="176.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >缺 :88405 起的 812 个事务</text>
<path d="M 620.0,161.0 L 554.0,161.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<text x="587" y="148" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="400" >缺这段</text>
<rect x="620" y="250" width="290" height="132" rx="6" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<text x="632" y="268" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">ERROR 1236 (HY000):</text>
<text x="632" y="284" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">Got fatal error 1236 from</text>
<text x="632" y="300" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">master when reading data</text>
<text x="632" y="316" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">from binary log:</text>
<text x="632" y="332" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">&#x27;... has purged binary logs</text>
<text x="632" y="348" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">containing GTIDs that the</text>
<text x="632" y="364" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">slave requires.&#x27;</text>
<path d="M 765.0,200.0 L 765.0,250.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="50" y="470" width="860" height="108" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="492" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >gtid_owned　「我正在做什么」——一个还没结算的临时状态</text>
<rect x="70" y="502" width="360" height="60" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="250.0" y="527.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >gtid_owned：正在执行的 GTID</text>
<text x="250.0" y="547.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >提交则并入 executed，回滚则永不并入</text>
<text x="452" y="518" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >读法：SHOW STATUS LIKE &#x27;gtid_owned&#x27;</text>
<text x="452" y="540" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >SHOW PROCESSLIST 里没有这一列；并行复制下每个 worker 各持一个</text>
<path d="M 52 610 L 78 610" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="85" y="614" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >GTID 集合</text>
<path d="M 52 630 L 78 630" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="85" y="634" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >binlog 仍在，可发</text>
<path d="M 300 610 L 326 610" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="333" y="614" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >越界 / 1236</text>
<path d="M 300 630 L 326 630" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="333" y="634" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >执行中，未结算</text>
</svg>