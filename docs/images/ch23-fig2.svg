<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker></defs>
<rect width="960" height="660" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 23-2　用 SET GTID_NEXT 跳过一条事务：五步，缺一步就无限重试</text>
<text x="24" y="60" font-size="12" fill="#6b7280">空事务不是占位，是把 GTID 的所有权结算掉；gtid_executed 里没有它，applier 就重放同一件事</text>
<rect x="60" y="88" width="500" height="76" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="310.0" y="121.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >applier 停在 1062</text>
<text x="310.0" y="141.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >Worker 1 failed executing transaction &#x27;3e11c4a2-…:88421&#x27;</text>
<rect x="60" y="190" width="500" height="54" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310.0" y="212.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">① STOP REPLICA;</text>
<text x="310.0" y="232.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >8.0.23 之前写作 STOP SLAVE</text>
<rect x="60" y="270" width="500" height="54" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="310.0" y="292.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">② SET GTID_NEXT=&#x27;3e11c4a2-…:88421&#x27;;</text>
<text x="310.0" y="312.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >声明下一条要执行的事务身份</text>
<rect x="60" y="350" width="500" height="54" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="310.0" y="372.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">③ BEGIN; COMMIT;</text>
<text x="310.0" y="392.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >空事务：让这个 GTID 落进 gtid_executed</text>
<rect x="60" y="430" width="500" height="54" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="310.0" y="452.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">④ SET GTID_NEXT=&#x27;AUTOMATIC&#x27;;</text>
<text x="310.0" y="472.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >交回自动分配，否则后面的写入都顶着它</text>
<rect x="60" y="510" width="500" height="54" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="310.0" y="532.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">⑤ START REPLICA;</text>
<text x="310.0" y="552.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >重读同一个事件，集合里已有 → 整条跳过</text>
<path d="M 560.0,537.0 L 600.0,537.0 L 600.0,126.0 L 560.0,126.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#m_e_dc2626)"/>
<text x="600" y="114" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="400" >无限重试</text>
<rect x="640" y="88" width="280" height="210" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="654" y="110" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >为什么必须是空事务</text>
<text x="656" y="140" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >gtid_executed 认的是提交：</text>
<text x="656" y="166" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >只在事务里 SET 一下不算数，</text>
<text x="656" y="192" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >空事务提交之后集合里才有它。</text>
<text x="656" y="218" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >applier 再读到同一个 GTID 事件，</text>
<text x="656" y="244" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >发现已经有 → 整条跳过。</text>
<text x="656" y="270" font-size="10" fill="#dc2626" text-anchor="start" font-weight="400" >不写空事务 → 每次都重放同一条</text>
<rect x="640" y="332" width="280" height="214" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="654" y="354" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >三条禁区</text>
<text x="656" y="384" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >事务中执行：与隐式提交冲突</text>
<text x="656" y="410" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >本会话已持有 GTID：直接报错</text>
<text x="656" y="436" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >gtid_mode=OFF：拒绝设具体 GTID</text>
<text x="656" y="462" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >第四个坑在流程外：忘了改回</text>
<text x="656" y="488" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >AUTOMATIC，后续事务全用同</text>
<text x="656" y="514" font-size="10" fill="#111827" text-anchor="start" font-weight="400" >一个 GTID，从库只能应用第一条</text>
<text x="60" y="600" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >空事务也会写进从库自己的 binlog：这台从库将来被提升，这次跳过会跟着传播下去。</text>
<text x="60" y="624" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >跳过只让复制继续，不修数据。跳过之前先确认这条事务在从库上确实不该执行。</text>
</svg>