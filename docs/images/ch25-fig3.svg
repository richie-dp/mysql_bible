<rect width="960" height="590" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 25-3　replica_preserve_commit_order=ON：并行回放、串行提交</text>
<text x="24" y="60" font-size="12" fill="#6b7280">worker 改完行、拿着锁，却必须等序位在它前面的事务先提交——整体推进由最慢的那个决定</text>
<text x="50" y="96" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >coordinator 按依赖关系分发事务，分发时并不知道哪个 worker 跑得快</text>
<rect x="50" y="120" width="96" height="44" rx="22.0" ry="22.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="98.0" y="145.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >worker 1</text>
<rect x="170" y="120" width="180" height="46" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="260.0" y="147.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >T1 执行</text>
<rect x="362" y="120" width="50" height="46" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="387.0" y="147.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >提交</text>
<rect x="50" y="206" width="96" height="44" rx="22.0" ry="22.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="98.0" y="231.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >worker 2</text>
<rect x="170" y="206" width="100" height="46" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="220.0" y="233.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >T2 执行</text>
<rect x="282" y="206" width="130" height="46" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="347.0" y="233.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >等 T1 提交</text>
<rect x="424" y="206" width="50" height="46" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="449.0" y="233.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >提交</text>
<rect x="50" y="292" width="96" height="44" rx="22.0" ry="22.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="98.0" y="317.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >worker 3</text>
<rect x="170" y="292" width="130" height="46" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="235.0" y="319.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >T3 执行</text>
<rect x="312" y="292" width="162" height="46" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="393.0" y="319.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >等 T2 提交</text>
<rect x="486" y="292" width="50" height="46" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="511.0" y="319.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >提交</text>
<path d="M 387.0,168.0 L 387.0,202.0" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<path d="M 449.0,254.0 L 449.0,288.0" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<text x="556" y="322" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Exec_Source_Log_Pos 到这里才前移</text>
<text x="50" y="372" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >三个事务的执行时长接近，但提交被串成一条链：落后一个就全体停摆，其余 worker 的执行时间全部沉没。</text>
<rect x="50" y="392" width="470" height="82" rx="6" ry="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<text x="62" y="409" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="400" >SHOW PROCESSLIST</text>
<text x="62" y="430" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">| 14 | system user | Waiting for dependent |</text>
<text x="62" y="447" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">| 15 | system user | transaction to commit  |</text>
<text x="62" y="464" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">| 16 | system user | Executing event       |</text>
<rect x="540" y="392" width="370" height="82" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="725.0" y="428.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >卡点在提交，不在执行</text>
<text x="725.0" y="448.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >并行是生效的，吃掉并行度的是提交序</text>
<path d="M 50 500 L 76 500" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="83" y="504" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >执行事务体（真并行）</text>
<path d="M 50 520 L 76 520" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="83" y="524" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >等前序提交（并行度被吃掉的地方）</text>
<path d="M 50 540 L 76 540" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="83" y="544" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >提交并推进低水位</text>
</svg>