<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 26-3　RTO 的真实构成：切换脚本只是中间一小段</text>
<text x="24" y="60" font-size="12" fill="#6b7280">比例示意，非实测；实际占比取决于探活间隔、应用连接池与业务预热方式</text>
<rect x="80" y="200" width="170" height="64" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="165.0" y="227.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >检测</text>
<text x="165.0" y="247.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >探活间隔 × 失败次数</text>
<rect x="250" y="200" width="80" height="64" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="290.0" y="227.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >决策</text>
<text x="290.0" y="247.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >人工 / 工具</text>
<rect x="330" y="200" width="110" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="385.0" y="227.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >切换</text>
<text x="385.0" y="247.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >隔离 → 提升</text>
<rect x="440" y="200" width="330" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="605.0" y="227.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >应用重连</text>
<text x="605.0" y="247.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >旧连接等 TCP 超时</text>
<rect x="770" y="200" width="110" height="64" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="825.0" y="227.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >预热</text>
<text x="825.0" y="247.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >连接池 / 缓存</text>
<path d="M 250.0,282.0 L 440.0,282.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
<text x="345" y="298" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600" >脚本执行时间</text>
<text x="80" y="326" font-size="11" fill="#6b7280" text-anchor="start" font-weight="600" >只统计脚本时的口径</text>
<rect x="80" y="340" width="190" height="40" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="175.0" y="363.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >190px 的执行段</text>
<rect x="270" y="340" width="610" height="40" rx="8" ry="8" fill="#ffffff" stroke="#475569" stroke-width="1.3" stroke-dasharray="6,4"/>
<text x="575.0" y="365" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >检测、重连、预热都不在统计里</text>
<text x="80" y="420" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >RTO = 检测 + 决策 + 切换 + 应用重连 + 预热。只优化第三段，等于只改了一小截。</text>
<text x="80" y="444" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >检测的下限由探活间隔决定；应用重连的上限由连接池与 TCP 重传决定。</text>
<path d="M 80 492 L 106 492" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="113" y="496" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >检测等待</text>
<path d="M 210 492 L 236 492" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="243" y="496" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >决策</text>
<path d="M 330 492 L 356 492" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="363" y="496" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >切换动作</text>
<path d="M 470 492 L 496 492" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="503" y="496" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >应用重连</text>
<path d="M 610 492 L 636 492" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="643" y="496" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >预热</text>
</svg>