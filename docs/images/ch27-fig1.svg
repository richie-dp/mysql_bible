<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker></defs>
<rect width="960" height="700" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 27-1　认证的四步：提交发生在③之后，数据可见发生在④之后</text>
<text x="24" y="60" font-size="12" fill="#6b7280">事务在①就已经执行完；③才发现冲突，只能靠 undo 撤掉——这是「乐观」的全部含义</text>
<rect x="50" y="96" width="520" height="76" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310.0" y="129.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >① 本地执行完，尚未提交</text>
<text x="310.0" y="149.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >redo 已 prepare、binlog 已写未 fsync；其他会话看不到</text>
<rect x="50" y="214" width="520" height="76" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="310.0" y="247.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >② 广播写集（write set）</text>
<text x="310.0" y="267.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >表 + 主键值 + 行级哈希；经组通信送到全组</text>
<rect x="50" y="332" width="520" height="76" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="310.0" y="365.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >③ 多数派认证（按行并行）</text>
<text x="310.0" y="385.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >各成员用认证数据库比对「已认证、未应用」的行哈希</text>
<rect x="50" y="450" width="520" height="76" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310.0" y="483.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >④ 提交，并广播 apply</text>
<text x="310.0" y="503.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >发起节点 COMMIT；其他成员收到 apply 才真正改数据</text>
<path d="M 310.0,172.0 L 310.0,214.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 310.0,290.0 L 310.0,332.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 310.0,408.0 L 310.0,450.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="620" y="96" width="290" height="76" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="765.0" y="129.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >多数派 = n/2 + 1</text>
<text x="765.0" y="149.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >3 节点要 2 票，5 节点要 3 票</text>
<rect x="620" y="214" width="290" height="76" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="765.0" y="247.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >认证可以并行</text>
<text x="765.0" y="267.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >哈希以主键为粒度，不同行互不冲突</text>
<path d="M 570.0,252.0 L 620.0,252.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3" marker-end="url(#m_e_475569)"/>
<rect x="620" y="332" width="290" height="76" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="765.0" y="365.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >冲突回滚发生在这里</text>
<text x="765.0" y="385.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >事务早已执行完，客户端收到 ERROR 3101</text>
<path d="M 570.0,370.0 L 620.0,370.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3" marker-end="url(#m_e_dc2626)"/>
<rect x="620" y="450" width="290" height="76" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="765.0" y="483.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >认证通过 ≠ 已应用</text>
<text x="765.0" y="503.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >④ 之后才开始应用；之前 B、C 读到的是旧值</text>
<path d="M 570.0,488.0 L 620.0,488.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3" marker-end="url(#m_e_ea580c)"/>
<text x="50" y="566" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >认证数据库要保留「已认证、未应用」的写集，直到本节点应用完才能清理。</text>
<text x="50" y="590" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >所以慢成员的认证库会持续膨胀，永远追不上——这就是流控（27.1.5）存在的理由。</text>
<text x="50" y="618" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >没有主键的表拿不到行标识，写集只能退化为整表范围：两个并发写必然判冲突。</text>
<path d="M 50 652 L 76 652" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="83" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >提交路径</text>
<path d="M 230 652 L 256 652" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="263" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >组通信</text>
<path d="M 390 652 L 416 652" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="423" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >认证通过</text>
<path d="M 560 652 L 586 652" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="593" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >冲突回滚</text>
<path d="M 730 652 L 756 652" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="763" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >等待 / 未应用</text>
</svg>