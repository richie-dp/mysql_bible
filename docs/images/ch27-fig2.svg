<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 27-2　一致性五个级别：每个级别在等什么，代价落在读还是写</text>
<text x="24" y="60" font-size="12" fill="#6b7280">越往右保证越强，等待越长；EVENTUAL 之外的四级买的都是「可见性」，不是「提交安全」</text>
<rect x="45" y="130" width="130" height="96" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="110.0" y="173.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >EVENTUAL</text>
<text x="110.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >默认，不等待</text>
<path d="M 110.0,226.0 L 110.0,288.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,3" marker-end="url(#m_e_475569)"/>
<rect x="45" y="350" width="130" height="78" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="110.0" y="384.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >不等待</text>
<text x="110.0" y="404.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >代价：0</text>
<text x="110.0" y="456" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >报表 / 列表页</text>
<rect x="215" y="130" width="190" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="310.0" y="173.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >BEFORE_ON_PRIMARY_FAILOVER</text>
<text x="310.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >切主后先追平</text>
<path d="M 310.0,226.0 L 310.0,288.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,3" marker-end="url(#m_e_475569)"/>
<rect x="215" y="350" width="190" height="78" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="310.0" y="384.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >切主后先应用积压</text>
<text x="310.0" y="404.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >只在切主后花钱</text>
<text x="310.0" y="456" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >所有集群都该开</text>
<rect x="445" y="130" width="130" height="96" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="510.0" y="173.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >BEFORE</text>
<text x="510.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >读前等应用</text>
<path d="M 510.0,226.0 L 510.0,288.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,3" marker-end="url(#m_e_475569)"/>
<rect x="445" y="350" width="130" height="78" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="510.0" y="384.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >等本节点应用完</text>
<text x="510.0" y="404.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >代价：读延迟增加</text>
<text x="510.0" y="456" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >详情页读己之写</text>
<rect x="615" y="130" width="130" height="96" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="680.0" y="173.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >AFTER</text>
<text x="680.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >写后等应用</text>
<path d="M 680.0,226.0 L 680.0,288.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,3" marker-end="url(#m_e_475569)"/>
<rect x="615" y="350" width="130" height="78" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="680.0" y="384.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >等成员应用完</text>
<text x="680.0" y="404.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >代价：写延迟增加</text>
<text x="680.0" y="456" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >支付 / 库存扣减</text>
<rect x="785" y="130" width="130" height="96" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="850.0" y="173.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >BEFORE_AND_AFTER</text>
<text x="850.0" y="193.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >读写都等</text>
<path d="M 850.0,226.0 L 850.0,288.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,3" marker-end="url(#m_e_475569)"/>
<rect x="785" y="350" width="130" height="78" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="850.0" y="384.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >两边都等</text>
<text x="850.0" y="404.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >代价：最慢</text>
<text x="850.0" y="456" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >账务核对</text>
<path d="M 40.0,292.0 L 920.0,292.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<text x="40" y="318" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >弱：不等待，可能读到旧值</text>
<text x="920" y="318" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400" >强：读写都等，延迟最高</text>
<text x="480" y="318" font-size="10" fill="#475569" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">group_replication_consistency</text>
<text x="45" y="500" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >同步点只由处在非 EVENTUAL 级别的成员应答：把一台只读成员长期留在 EVENTUAL，它就不在这次等待里。</text>
<text x="45" y="522" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >级别不改变「提交要过多数派认证」，只改变「读/写什么时候返回」。</text>
<path d="M 45 542 L 71 542" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="78" y="546" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >无等待</text>
<path d="M 200 542 L 226 542" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="233" y="546" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >读同步</text>
<path d="M 360 542 L 386 542" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="393" y="546" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >写同步</text>
<path d="M 520 542 L 546 542" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="553" y="546" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >读 + 写</text>
</svg>