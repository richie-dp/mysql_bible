<text x="60" y="342" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >恢复产物落在一个新的 datadir 上，</text>
<text x="60" y="364" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >校验通过再切回。</text>
