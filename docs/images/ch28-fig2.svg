<text x="186.5" y="505.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >① 备份位点已被 purge</text>
<text x="186.5" y="525.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >链断在第一步</text>
