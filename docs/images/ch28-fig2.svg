<text x="620" y="154" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="600" >t_bad − 1s</text>
<text x="700" y="134" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >误操作 COMMIT</text>
<text x="700" y="154" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600" >t_bad</text>
<text x="210" y="244" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="600" >t0 全备结束</text>
<text x="210" y="264" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >位点 = 某个 end_log_pos</text>
<text x="700" y="244" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="600" >20:41:07 DELETE</text>
<text x="840" y="244" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >binlog 尾</text>
<rect x="520" y="296" width="200" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="620.0" y="319.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >恢复到临时实例</text>
<text x="620.0" y="339.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >stop-position = t_bad − 1s</text>
<path d="M 620.0,296.0 L 620.0,214.0" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
