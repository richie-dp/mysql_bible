<rect width="960" height="690" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 28-2　PITR 的时间轴：全备之后，binlog 必须连续</text>
<text x="24" y="60" font-size="12" fill="#6b7280">恢复点在误操作前 1 秒；全备位点与 binlog 的衔接点差一个事务，后面全部错位</text>
<rect x="40" y="84" width="880" height="330" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
