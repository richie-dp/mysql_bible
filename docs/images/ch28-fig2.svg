<text x="479.5" y="505.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >② 用时间当刀口</text>
<text x="479.5" y="525.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >多恢复或少恢复</text>
<rect x="646" y="482" width="253" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="772.5" y="505.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >③ 只恢复全备</text>
<text x="772.5" y="525.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >备份之后的写入全丢</text>
