<text x="93" y="644" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >恢复点</text>
<path d="M 60 660 L 86 660" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="93" y="664" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >误操作 / 断链</text>
