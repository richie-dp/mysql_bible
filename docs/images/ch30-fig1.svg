<path d="M 906.0,268.0 L 452.0,268.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#m_e_dc2626)"/>
<rect x="543.6" y="249.0" width="270.9" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="679.0" y="259.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >⑤ [5.7] 重启后取 MAX(id)+1，已删除的号会被重发</text>
<rect x="40" y="292" width="880" height="244" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="314" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >五个来源，各给一个能复现的动作</text>
<text x="60" y="332" font-size="12" fill="#ea580c" text-anchor="start" font-weight="400" >① 批量插入：INSERT ... SELECT / LOAD DATA 拿不到准确行数，mode=2 按倍增的预估值领一段号，领多了直接丢弃。</text>
<text x="60" y="362" font-size="12" fill="#ea580c" text-anchor="start" font-weight="400" >② INSERT ... ON DUPLICATE KEY UPDATE：先取号，再判唯一键；冲突时号已经消耗，改走 UPDATE。</text>
<text x="60" y="392" font-size="12" fill="#ea580c" text-anchor="start" font-weight="400" >③ REPLACE INTO：本质是 DELETE + INSERT；被删的行不还号，新行再领一个。</text>
<text x="60" y="422" font-size="12" fill="#ea580c" text-anchor="start" font-weight="400" >④ 事务回滚：计数器不在事务里，ROLLBACK 只回滚行，不回滚号。</text>
<text x="60" y="452" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >⑤ 重启：[5.7] 计数器不持久化，取 MAX(id)+1，可能重发已删除的号；[8.0] 计数器进 redo，只前进不回退。</text>
<text x="60" y="496" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >自增只保证单调递增，不保证连续。把 id 当业务单号展示，等于把「发号策略」写进了对外契约。</text>
</svg>