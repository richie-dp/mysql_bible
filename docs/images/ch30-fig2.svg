<text x="60" y="490" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >单调性决定写入落点与能否排序；时钟依赖决定机房断电重启后还能不能继续发号。</text>
<text x="60" y="514" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >号段与 Redis 把唯一性押在中心存储，雪花押在机器 ID 分配，UUID 押在随机数的概率上。</text>
<text x="60" y="538" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >分片友好度问的是：只拿到 ID，能不能算出它属于哪个分片？算不出，就得再维护一张映射表。</text>
