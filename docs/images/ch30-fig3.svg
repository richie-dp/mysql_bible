<text x="826.0" y="302.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >50%</text>
<rect x="744" y="320" width="164" height="54" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="826.0" y="342.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 4</text>
<text x="826.0" y="362.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >50%</text>
<rect x="744" y="380" width="164" height="54" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
