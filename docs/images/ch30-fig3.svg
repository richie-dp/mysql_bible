<text x="670" y="468" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >无热点，但每次插入都可能换进一个冷页</text>
<path d="M 54.0,393.0 L 126.0,393.0" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
