<text x="210.0" y="282.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 3</text>
<text x="210.0" y="302.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >94%</text>
<rect x="128" y="320" width="164" height="54" rx="6" ry="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="210.0" y="342.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 4</text>
<text x="210.0" y="362.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >94%</text>
<rect x="128" y="380" width="164" height="54" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="210.0" y="402.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 5</text>
<text x="210.0" y="422.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >latch 争用</text>
<text x="54" y="468" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >右分裂只劈一页，代价是同一页的 latch 排队</text>
<rect x="348" y="92" width="264" height="396" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="362" y="114" font-size="13" fill="#475569" text-anchor="start" font-weight="600" >② 雪花 / UUIDv7：落在当前时间窗</text>
<rect x="436" y="140" width="164" height="54" rx="6" ry="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="518.0" y="162.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 1</text>
<text x="518.0" y="182.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >94%</text>
<rect x="436" y="200" width="164" height="54" rx="6" ry="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
