<text x="518.0" y="402.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 5</text>
<text x="518.0" y="422.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >94%</text>
<text x="362" y="468" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >窗口内的页仍被并发写，窗口随分片键散开</text>
<rect x="656" y="92" width="264" height="396" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="670" y="114" font-size="13" fill="#475569" text-anchor="start" font-weight="600" >③ UUIDv4：落点随机</text>
