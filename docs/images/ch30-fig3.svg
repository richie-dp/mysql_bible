<text x="518.0" y="342.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >叶子页 4</text>
<text x="518.0" y="362.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >窗口边缘</text>
