<rect width="960" height="600" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 30-3　写入落点：自增打尾页、雪花打时间窗、UUID 打散全树</text>
<text x="24" y="60" font-size="12" fill="#6b7280">每条横条是一个叶子页；箭头是一次插入的落点，越红表示并发争用越强</text>
<rect x="40" y="92" width="264" height="396" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="114" font-size="13" fill="#475569" text-anchor="start" font-weight="600" >① 自增主键：写永远落在最后一页</text>
