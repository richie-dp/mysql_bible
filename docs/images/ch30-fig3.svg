<text x="40" y="518" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >① 自增的瓶颈不是页分裂：右分裂只影响最后一页，真正的排队点是这页的页 latch 与 index-&gt;lock 的 SX 争用。</text>
<text x="40" y="544" font-size="12" fill="#ea580c" text-anchor="start" font-weight="400" >② 雪花按时间单调，落点同样集中在「当前毫秒」那一段键；序列位用完要等下一毫秒，等于把一个微秒级的锁换成时钟。</text>
<text x="40" y="570" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >③ UUID 把写摊到全树：没有热点，但每插一行都可能把冷页读进 Buffer Pool，把热页挤出去。</text>
</svg>