<text x="40" y="634" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >体积：2 亿 × 4000B ≈ 800GB　｜　2 亿 × 400B ≈ 80GB　　叶页：5000 万　vs　500 万</text>
<text x="40" y="656" font-size="11" fill="#2563eb" text-anchor="start" font-weight="400" >同样 2 亿行，树高都是四层；被行宽改变的只有叶子层的页数，以及这些页能有多少留在内存里。</text>
