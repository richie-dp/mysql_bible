<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 31-3　状态字段三种设计：四个维度的对照</text>
<text x="24" y="60" font-size="12" fill="#6b7280">生产形态通常是「主表存当前状态 + 流水表存历史」，两者在同一事务里双写</text>
<rect x="40" y="96" width="110" height="40" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="95.0" y="120.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >维度</text>
<rect x="190" y="96" width="210" height="40" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="295.0" y="120.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >单列状态机</text>
<rect x="440" y="96" width="210" height="40" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="545.0" y="120.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >状态 + 时间戳列</text>
<rect x="690" y="96" width="230" height="40" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="805.0" y="120.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >状态流水表</text>
<rect x="40" y="152" width="110" height="66" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="95.0" y="189.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >查询当前状态</text>
<rect x="190" y="152" width="210" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="295.0" y="180.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >一次主键读</text>
<text x="295.0" y="200.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >最直接</text>
<rect x="440" y="152" width="210" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="545.0" y="180.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >一次主键读</text>
<text x="545.0" y="200.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >顺带读到时间</text>
<rect x="690" y="152" width="230" height="66" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="805.0" y="180.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >取最新一条</text>
<text x="805.0" y="200.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >ORDER BY id DESC LIMIT 1</text>
<rect x="40" y="232" width="110" height="66" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="95.0" y="269.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >查历史变更</text>
<rect x="190" y="232" width="210" height="66" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="295.0" y="260.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >查不到</text>
<text x="295.0" y="280.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >只有当前值</text>
<rect x="440" y="232" width="210" height="66" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="545.0" y="260.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >只有时间点</text>
<text x="545.0" y="280.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >没有操作人</text>
<rect x="690" y="232" width="230" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="805.0" y="260.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >完整流水</text>
<text x="805.0" y="280.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >可审计、可追责</text>
<rect x="40" y="312" width="110" height="66" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="95.0" y="349.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >索引友好度</text>
<rect x="190" y="312" width="210" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="295.0" y="340.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >(status, created_at)</text>
<text x="295.0" y="360.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >直接可用</text>
<rect x="440" y="312" width="210" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="545.0" y="340.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >(status, shipped_at)</text>
<text x="545.0" y="360.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >按事件精确筛</text>
<rect x="690" y="312" width="230" height="66" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="805.0" y="340.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >要按 order_id 回查</text>
<text x="805.0" y="360.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >无全局状态索引</text>
<rect x="40" y="392" width="110" height="66" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="95.0" y="429.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >存储成本</text>
<rect x="190" y="392" width="210" height="66" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="295.0" y="420.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >1 字节/行</text>
<text x="295.0" y="440.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >2 亿行约 200MB</text>
<rect x="440" y="392" width="210" height="66" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="545.0" y="420.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >5~8 字节×状态数</text>
<text x="545.0" y="440.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >20 状态约 24GB</text>
<rect x="690" y="392" width="230" height="66" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="805.0" y="420.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >60 字节×变更次数</text>
<text x="805.0" y="440.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >12 亿行约 100GB</text>
<rect x="40" y="488" width="880" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="510" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >选型顺序</text>
<text x="62" y="534" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >要审计、要算每个状态的停留时长 → 流水表，同时接受主表那一列只是缓存。</text>
<text x="62" y="556" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >只要「某天发货了多少单」这类筛选 → 时间戳列 + (status, 事件时间) 联合索引。</text>
<text x="62" y="578" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >只要当前状态、且状态数固定 → 单列 TINYINT，别为可能的需求提前付列数与 DDL 的成本。</text>
</svg>