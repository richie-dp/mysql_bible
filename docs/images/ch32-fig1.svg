<text x="73" y="490" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >按非分区键查：4 个分区全部打开</text>
<path d="M 40 506 L 66 506" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="73" y="510" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >每个分区：一套聚簇索引 + 一套二级索引</text>
<path d="M 40 526 L 66 526" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#m_e_475569)"/>
<text x="73" y="530" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >分区之间没有共享的根页、也没有全局索引</text>
<rect x="40" y="552" width="880" height="96" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="574" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >代价的方向</text>
<text x="60" y="594" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >分区表不是「一棵更大的树」，是 4 棵互不相通的树：各有根页、各有叶链、各有一份 idx_buyer。</text>
<text x="60" y="620" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400" >所以按非分区键查的代价 = 单分区代价 × 分区数；执行器是单线程的，这 4 棵不会被并行扫。</text>
