<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 32-2　DROP PARTITION 与 DELETE：一条元数据命令 vs 一晚上脚本</text>
<text x="24" y="60" font-size="12" fill="#6b7280">同是删掉三个月共 1.2 亿行；红色是随行数线性增长的资源，橙色是一次元数据操作</text>
<path d="M 240.0,140.0 L 900.0,140.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4,3" marker-end="url(#m_e_475569)"/>
<rect x="827.0" y="121.0" width="40.3" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="847.2" y="131.0" font-size="11" fill="#475569" text-anchor="middle" font-weight="500" >耗时 →</text>
<text x="240" y="152" font-size="10" fill="#475569" text-anchor="middle" font-weight="400" >T0</text>
<text x="470" y="152" font-size="10" fill="#475569" text-anchor="middle" font-weight="400" >+1h</text>
<text x="700" y="152" font-size="10" fill="#475569" text-anchor="middle" font-weight="400" >+1 夜</text>
<text x="866" y="152" font-size="10" fill="#475569" text-anchor="middle" font-weight="400" >第 2 天</text>
<rect x="40" y="170" width="180" height="52" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="130.0" y="191.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >DELETE</text>
<text x="130.0" y="211.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >分批 1000 行</text>
<rect x="240" y="170" width="660" height="52" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="570.0" y="199.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >逐行定位 → delete-mark → 写 undo → 写 redo → 写 binlog row event</text>
<rect x="240" y="236" width="130" height="46" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="305.0" y="262.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >undo 每行一份</text>
<rect x="410" y="236" width="130" height="46" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="475.0" y="262.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >binlog 每行一条</text>
<rect x="580" y="236" width="130" height="46" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="645.0" y="262.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >purge 追不上</text>
<rect x="750" y="236" width="130" height="46" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="815.0" y="262.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >DATA_FREE 上涨</text>
<text x="240" y="302" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >耗时、undo、binlog 量、从库延迟、碎片，全部与行数成正比。</text>
<rect x="40" y="356" width="180" height="52" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="130.0" y="377.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >DROP PARTITION</text>
<text x="130.0" y="397.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >元数据操作</text>
<rect x="240" y="356" width="96" height="52" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="288.0" y="386.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >秒级</text>
<text x="352" y="388" font-size="11" fill="#16a34a" text-anchor="start" font-weight="400" >与分区里装了多少行无关</text>
<rect x="240" y="422" width="150" height="46" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="315.0" y="448.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >数据字典更新</text>
<rect x="412" y="422" width="150" height="46" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="487.0" y="448.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >unlink 对应 .ibd</text>
<rect x="584" y="422" width="150" height="46" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="659.0" y="448.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >binlog 只有一条 DDL</text>
<text x="240" y="492" font-size="11" fill="#ea580c" text-anchor="start" font-weight="400" >不删行、不写 undo、不产生 row event、不留碎片，也不需要 OPTIMIZE。</text>
<rect x="40" y="522" width="880" height="96" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="544" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >为什么这两条路径差这么多</text>
<text x="60" y="564" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >DELETE 是 DML：每一行都是一个事务里的修改，要能回滚、要能复制、要在页内留下空洞。</text>
<text x="60" y="588" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >DROP PARTITION 是 DDL：改数据字典 + 摘掉表定义里的一段 + unlink 文件，数据页直接被丢弃。</text>
<text x="60" y="610" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >代价并没有消失，只是被挪到了「拿 MDL」那一刻：要等这张表上没有长事务在跑。</text>
</svg>