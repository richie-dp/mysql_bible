<text x="480.0" y="205.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >无键可算 → 广播</text>
<path d="M 800.0,152.0 L 800.0,184.0" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="722" y="184" width="156" height="36" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="800.0" y="205.5" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >JOIN 键 = 分片键</text>
