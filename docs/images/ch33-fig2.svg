<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 33-2　跨分片查询的三条路径：带分片键 / 不带分片键 / 绑定表 JOIN</text>
<text x="24" y="60" font-size="12" fill="#6b7280">同一张 4 分片的订单表；绿色是只打开的分片，红色是广播出去的每一条 SQL</text>
<rect x="40" y="96" width="240" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="160.0" y="119.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >① 带分片键</text>
<text x="160.0" y="139.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >WHERE buyer_id = 8842</text>
<rect x="360" y="96" width="240" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="119.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >② 不带分片键</text>
<text x="480.0" y="139.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >WHERE order_no = &#x27;SO...&#x27;</text>
<rect x="680" y="96" width="240" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="800.0" y="119.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >③ 绑定表 JOIN</text>
<text x="800.0" y="139.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" >order_main ⋈ order_item</text>
