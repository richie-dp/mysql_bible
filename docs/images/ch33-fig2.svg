<rect x="40" y="330" width="240" height="58" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="160.0" y="354.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >代价：1 次查询</text>
<text x="160.0" y="374.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >另外 3 片完全没参与</text>
<rect x="360" y="330" width="240" height="58" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="354.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >代价：N 次查询</text>
<text x="480.0" y="374.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >延迟 = 最慢的那一片</text>
<rect x="680" y="330" width="240" height="58" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="800.0" y="354.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >代价：1 分片内 2 次查询</text>
<text x="800.0" y="374.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >JOIN 不跨网络</text>
<rect x="40" y="412" width="880" height="104" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="434" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >三条路的本质差别</text>
<text x="60" y="452" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >带分片键：路由函数只算一次，SQL 改写成 1 条。它能成立的前提是查询里真的带了这个键。</text>
<text x="60" y="474" font-size="11" fill="#dc2626" text-anchor="start" font-weight="400" >不带键：SQL 被改写成 N 条并发下发，路由层等最慢的一片，N 越大 P99 越难看；分片数在这里是乘数。</text>
<text x="60" y="496" font-size="11" fill="#16a34a" text-anchor="start" font-weight="400" >绑定表：两张表同一个分片键、同一台机器，JOIN 回到单库执行——这是唯一不付额外代价的一条。</text>
<path d="M 40 534 L 66 534" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="73" y="538" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >单分片命中：1 次路由、1 次查询</text>
<path d="M 40 554 L 66 554" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="73" y="558" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >广播：N 条 SQL、延迟由最慢分片决定</text>
</svg>