<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 33-3　双倍扩容：4 → 8 只有一半数据要动，以及双写迁移的六个闸</text>
<text x="24" y="60" font-size="12" fill="#6b7280">h % 4 = i 的 key，在 h % 8 下只能是 i 或 i + 4；所以每个老分片正好一半留、一半走</text>
