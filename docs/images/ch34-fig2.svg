<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 34-2　本地消息表的状态机</text>
<text x="24" y="60" font-size="12" fill="#6b7280">业务写与消息写同一个本地事务；投递可失败可重复，状态迁移靠 affected_rows 判首次</text>
<text x="60" y="100" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600" >正常链路</text>
<text x="60" y="316" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600" >异常分支</text>
<rect x="110" y="120" width="170" height="74" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="195.0" y="152.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">pending</text>
<text x="195.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >本地事务已提交</text>
<rect x="360" y="120" width="170" height="74" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="445.0" y="152.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">sent</text>
<text x="445.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >已投进 MQ</text>
<rect x="620" y="120" width="170" height="74" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="705.0" y="152.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">done</text>
<text x="705.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >下游已回写</text>
<path d="M 280.0,157.0 L 360.0,157.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="295.0" y="139.0" width="50.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="320.0" y="149.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500" >扫描投递</text>
<path d="M 530.0,157.0 L 620.0,157.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="548.7" y="139.0" width="52.6" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="575.0" y="149.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500" >ack 回写</text>
<path d="M 145.0,194.0 L 145.0,250.0 L 265.0,250.0 L 265.0,194.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#m_e_ea580c)"/>
<rect x="148.8" y="232.0" width="112.5" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="205.0" y="242.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="500" >投递失败 → 退避重试</text>
<rect x="110" y="330" width="200" height="74" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="210.0" y="362.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">failed</text>
<text x="210.0" y="382.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >超次数 → 人工队列</text>
<path d="M 280.0,180.0 L 330.0,180.0 L 330.0,367.0 L 310.0,367.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="335.0" y="252.5" width="101.9" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="338.0" y="262.5" font-size="11" fill="#dc2626" text-anchor="start" font-weight="500" >retry_count 超限</text>
<rect x="400" y="330" width="250" height="74" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="525.0" y="362.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >T+1 对账兜底</text>
<text x="525.0" y="382.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >总额 / 笔数 / 逐笔</text>
<path d="M 445.0,194.0 L 445.0,330.0" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#m_e_ea580c)"/>
<rect x="450.0" y="256.0" width="58.8" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="453.0" y="266.0" font-size="11" fill="#ea580c" text-anchor="start" font-weight="500" >卡在 sent</text>
<rect x="60" y="430" width="840" height="118" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="452" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >这张表看不出来的两件事</text>
<text x="80" y="472" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >① sent 只代表「投递成功」，不代表下游写成功：消费者失败、消息丢失，状态都停在 sent。</text>
<text x="80" y="496" font-size="12" fill="#111827" text-anchor="start" font-weight="400" >② 状态迁移一律写成 UPDATE ... WHERE msg_id = ? AND status = ?，用 affected_rows 判首次，重复投递天然幂等。</text>
<text x="80" y="520" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400" >没有对账，「最终一致」没有终点，只剩一份「我以为发出去了」的日志。</text>
<path d="M 60 574 L 86 574" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="93" y="578" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >待投递</text>
<path d="M 60 594 L 86 594" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="93" y="598" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >已投递</text>
<path d="M 300 574 L 326 574" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="333" y="578" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >已完成</text>
<path d="M 300 594 L 326 594" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="333" y="598" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >终止态</text>
<path d="M 540 574 L 566 574" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#m_e_ea580c)"/>
<text x="573" y="578" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >重试 / 兜底</text>
<path d="M 540 594 L 566 594" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#m_e_475569)"/>
<text x="573" y="598" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >虚线 = 异常路径</text>
