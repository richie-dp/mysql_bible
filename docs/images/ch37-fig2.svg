<text x="890" y="416" font-size="9" fill="#475569" text-anchor="end" font-weight="400" >时间 →</text>
<path d="M 682,366 L 752,366 L 884,367" fill="none" stroke="#2563eb" stroke-width="2.4"/>
<path d="M 682,382 L 734,382 L 734,250 L 884,252" fill="none" stroke="#9333ea" stroke-width="2.2"/>
