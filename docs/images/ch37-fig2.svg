<text x="359" y="132" font-size="12.5" fill="#111827" text-anchor="start" font-weight="600" >② 突发流量</text>
<line x1="377" y1="400" x2="585" y2="400" stroke="#d1d5db" stroke-width="1.2"/>
<line x1="377" y1="400" x2="377" y2="180" stroke="#d1d5db" stroke-width="1.2"/>
<text x="371" y="184" font-size="9" fill="#475569" text-anchor="end" font-weight="400" >高</text>
