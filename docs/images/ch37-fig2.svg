<text x="170.0" y="215.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >持续上行</text>
<text x="54" y="472" font-size="9.8" fill="#111827" text-anchor="start" font-weight="600" >connected 阶梯上行，running 平稳</text>
<text x="54" y="491" font-size="9.8" fill="#6b7280" text-anchor="start" font-weight="400" >→ 连接只增不减，池子永不回收</text>
