<rect width="960" height="560" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 37-2　Threads_connected 与 Threads_running：三种形态</text>
<text x="24" y="60" font-size="12" fill="#6b7280">同一组坐标轴上，两条线的相对走势比各自的绝对值更能定性</text>
<path d="M 40 84 L 66 84" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="73" y="88" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Threads_connected　资源占用</text>
<path d="M 40 104 L 66 104" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="73" y="108" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >Threads_running　并发压力</text>
<path d="M 40 124 L 66 124" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#m_e_dc2626)"/>
<text x="73" y="128" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >异常段标注</text>
