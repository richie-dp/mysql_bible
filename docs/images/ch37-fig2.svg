<text x="575" y="386" font-size="9.5" fill="#9333ea" text-anchor="end" font-weight="600" >running</text>
<text x="359" y="472" font-size="9.8" fill="#111827" text-anchor="start" font-weight="600" >两条线同向陡升陡降</text>
<text x="359" y="491" font-size="9.8" fill="#6b7280" text-anchor="start" font-weight="400" >→ 请求真的多了，连接与并发一起涨</text>
<rect x="650" y="110" width="265" height="340" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
