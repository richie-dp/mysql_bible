<text x="272" y="370" font-size="9.5" fill="#9333ea" text-anchor="end" font-weight="600" >running →</text>
<path d="M 134.0,222.0 L 206.0,222.0" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5,3" marker-end="url(#m_e_dc2626)"/>
