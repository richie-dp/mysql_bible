<text x="882" y="240" font-size="9.5" fill="#9333ea" text-anchor="end" font-weight="600" >running ↑</text>
<path d="M 778.0,280.0 L 854.0,280.0" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5,3" marker-end="url(#m_e_dc2626)"/>
<rect x="791.0" y="263.0" width="50.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="816.0" y="273.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >持续不降</text>
<text x="664" y="472" font-size="9.8" fill="#111827" text-anchor="start" font-weight="600" >connected 不变，running 冲高不降</text>
<text x="664" y="491" font-size="9.8" fill="#6b7280" text-anchor="start" font-weight="400" >→ 连接都卡在同一把锁上</text>
<text x="40" y="528" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >判据不是单点读数，而是两条线的相对走势；同一时刻的绝对连接数说明不了谁在等谁。</text>
