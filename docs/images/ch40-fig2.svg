<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="960" height="920">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="920" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 40-2　每个参数挂在哪一环：改它，动的是这条链路上的哪一段</text>
<text x="24" y="60" font-size="12" fill="#6b7280">同一行里的参数共享一个作用点；跨行改参数等于同时动两个瓶颈，故障时无法归因</text>
<rect x="60" y="96" width="840" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="80" y="126" width="130" height="50" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="145.0" y="155.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >内存分配</text>
<rect x="250" y="118" width="210" height="56" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="355.0" y="141.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >innodb_buffer_pool_size</text>
<text x="355.0" y="161.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >独占 70~80%；共部署要留余量</text>
<rect x="500" y="118" width="210" height="56" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="605.0" y="141.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >sort_buffer_size</text>
<text x="605.0" y="161.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >每连接 × 并发 = OOM 主因</text>
<text x="250" y="196" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改错：加内存追不上并发增长；OOM 先查 sort_buffer_size × Threads_running</text>
<rect x="60" y="226" width="840" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="80" y="256" width="130" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="145.0" y="285.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >刷脏与 IO</text>
<rect x="250" y="248" width="210" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="355.0" y="271.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >innodb_io_capacity</text>
<text x="355.0" y="291.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >默认 200 是 HDD 时代的数</text>
<rect x="500" y="248" width="210" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="605.0" y="271.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >innodb_flush_neighbors</text>
<text x="605.0" y="291.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >[8.0] 默认 0，SSD 别开</text>
<text x="250" y="326" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改错：刷不及时 checkpoint age 涨；设太大把设备 IO 打满，别的查询一起慢</text>
<rect x="60" y="356" width="840" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="80" y="386" width="130" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="145.0" y="415.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >提交持久性</text>
<rect x="250" y="378" width="210" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="355.0" y="401.0" font-size="10" fill="#111827" text-anchor="middle" font-weight="600" >innodb_flush_log_at_trx_commit</text>
<text x="355.0" y="421.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >默认 1；改成 2 丢掉最近 1 秒事务</text>
<rect x="500" y="378" width="210" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="605.0" y="401.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >innodb_redo_log_capacity</text>
<text x="605.0" y="421.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >[8.0.30+] 取代 log_file_size</text>
<text x="250" y="456" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改错：拿持久性换吞吐，金融场景就是事故；redo 太小则 checkpoint 频繁</text>
<rect x="60" y="486" width="840" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="80" y="516" width="130" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="145.0" y="545.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >并发入口</text>
<rect x="250" y="508" width="210" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="355.0" y="531.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >innodb_thread_concurrency</text>
<text x="355.0" y="551.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >默认 0；非 0 就在入口排队</text>
<rect x="500" y="508" width="210" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="605.0" y="531.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >table_open_cache</text>
<text x="605.0" y="551.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >Opened_tables 持续涨才该加</text>
<text x="250" y="586" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改错：人为制造排队，queries in queue 飙升，吞吐反而下降</text>
<rect x="60" y="616" width="840" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="80" y="646" width="130" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="145.0" y="675.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >临时表</text>
<rect x="250" y="638" width="210" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="355.0" y="661.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >tmp_table_size</text>
<text x="355.0" y="681.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >必须 = max_heap_table_size</text>
<rect x="500" y="638" width="210" height="56" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="605.0" y="661.0" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >temptable_max_ram</text>
<text x="605.0" y="681.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >[8.0] TempTable 的真实阈值</text>
<text x="250" y="716" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改错：只调大的那个，实际生效的是小的那个；[8.0] 默认下改它根本不生效</text>
<rect x="60" y="746" width="840" height="116" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="80" y="776" width="130" height="50" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="145.0" y="805.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >优化器决策</text>
<rect x="250" y="768" width="210" height="56" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="355.0" y="791.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >eq_range_index_dive_limit</text>
<text x="355.0" y="811.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >默认 200；长 IN 列表计划突变</text>
<rect x="500" y="768" width="210" height="56" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="605.0" y="791.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >range_optimizer_max_mem_size</text>
<text x="605.0" y="811.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >默认 8MB；超了退化成全表扫</text>
<text x="250" y="846" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >改错：SET GLOBAL 一改，救一条 SQL 可能坑掉另外一百条</text>
<path d="M 60 890 L 86 890" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="93" y="894" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >内存</text>
<path d="M 160 890 L 186 890" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="193" y="894" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >刷脏 / IO</text>
<path d="M 300 890 L 326 890" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="333" y="894" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >并发 / 参数阈值</text>
<path d="M 470 890 L 496 890" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="503" y="894" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >风险 / 误判</text>
<path d="M 620 890 L 646 890" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="653" y="894" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >优化器 / 跨层</text>
</svg>