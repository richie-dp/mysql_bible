<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 41-2　六段式复盘：前两段是现场，后四段是产物</text>
<text x="24" y="60" font-size="12" fill="#6b7280">每个案例都按同一个骨架写，差别只在第三段——它是唯一有机会改变结论的地方</text>
<rect x="60" y="200" width="105" height="76" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="112.5" y="242.9" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >现象</text>
<text x="112.5" y="300" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >现场看到</text>
<text x="112.5" y="318" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >什么</text>
<rect x="207" y="200" width="105" height="76" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="259.5" y="242.9" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >误判</text>
<text x="259.5" y="300" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >当时真的</text>
<text x="259.5" y="318" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >相信什么</text>
<rect x="354" y="200" width="105" height="76" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="406.5" y="242.9" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >数据</text>
<text x="406.5" y="300" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >拿哪个观测</text>
<text x="406.5" y="318" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >去推翻它</text>
<rect x="501" y="200" width="105" height="76" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="553.5" y="242.9" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >根因</text>
<text x="553.5" y="300" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >机制上哪</text>
<text x="553.5" y="318" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >一层错了</text>
<rect x="648" y="200" width="105" height="76" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="700.5" y="242.9" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >处置</text>
<text x="700.5" y="300" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >先做什么</text>
<text x="700.5" y="318" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >止住</text>
<rect x="795" y="200" width="105" height="76" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="847.5" y="242.9" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >长效措施</text>
<text x="847.5" y="300" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >改什么</text>
<text x="847.5" y="318" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >才不再来</text>
<path d="M 165.0,238.0 L 207.0,238.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 312.0,238.0 L 354.0,238.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 459.0,238.0 L 501.0,238.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 606.0,238.0 L 648.0,238.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 753.0,238.0 L 795.0,238.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 259.5,200.0 L 259.5,162.0 L 406.5,162.0 L 406.5,200.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#m_e_dc2626)"/>
<text x="333.0" y="152" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600" >唯一能翻盘：这一步换的是假设</text>
<rect x="60" y="350" width="840" height="130" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="372" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >六段之间的关系</text>
<text x="84" y="392" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >前两段是现场：现象是别人看到的，误判是你当时真的相信的。写不出“当时相信”，这一段就是假的。</text>
<text x="84" y="420" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >第三段是唯一的翻盘点：数据不是用来支持误判的，是用来淘汰误判的——它必须能区分两种假设。</text>
<text x="84" y="448" font-size="11" fill="#111827" text-anchor="start" font-weight="400" >后三段是产物：根因解释机制，处置止血，长效措施改系统；三者的验收标准互不替代。</text>
</svg>