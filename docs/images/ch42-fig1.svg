<text x="73" y="696" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >主流程 / 新事实</text>
<path d="M 240 692 L 266 692" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="273" y="696" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >索引路径</text>
<path d="M 400 692 L 426 692" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="433" y="696" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >危险失效点</text>
<path d="M 560 692 L 586 692" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="593" y="696" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >“旧”＝从今天起不再可靠的判断</text>
</svg>