<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="680" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 43-1　升级路径只有一条，迁移方式有三条</text>
<text x="24" y="60" font-size="12" fill="#6b7280">上半：能走的版本路线与每跳的门槛；下半：三种迁移方式在「跨版本」与「可回滚」上的硬边界</text>
<rect x="40" y="76" width="880" height="200" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="98" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >① 版本路径：唯一受支持的路线是 5.6 → 5.7 → 8.0 → 8.4</text>
<rect x="60" y="128" width="150" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="135.0" y="152.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >MySQL 5.6</text>
<text x="135.0" y="172.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >起点：.frm + MyISAM</text>
<rect x="265" y="128" width="150" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="340.0" y="152.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >MySQL 5.7</text>
<text x="340.0" y="172.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >过渡：原生 JSON / GTID</text>
<rect x="470" y="128" width="150" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="545.0" y="152.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >MySQL 8.0</text>
<text x="545.0" y="172.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >换字典：mysql.ibd</text>
<rect x="675" y="128" width="150" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="750.0" y="152.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >MySQL 8.4</text>
<text x="750.0" y="172.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >同代：8.x 字典不变</text>
<path d="M 210.0,157.0 L 265.0,157.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="223.5" y="139.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="237.5" y="149.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500" >必升</text>
<path d="M 415.0,157.0 L 470.0,157.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="428.5" y="139.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="442.5" y="149.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500" >必升</text>
<path d="M 620.0,157.0 L 675.0,157.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="628.0" y="139.0" width="39.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="647.5" y="149.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500" >可直升</text>
<path d="M 135.0,214.0 L 545.0,214.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4"/>
<text x="340" y="206" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600" >✗ 跳过 5.7：8.0 没有 5.6 字典的转换路径</text>
<text x="340" y="242" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >每一跳都能停、能全备、能回退到上一跳</text>
<text x="900" y="242" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400" >5.7 也不能直接到 8.4</text>
<rect x="40" y="316" width="880" height="320" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="54" y="338" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >② 三种迁移方式：能不能跨版本、能不能回滚、停多久</text>
<rect x="60" y="356" width="252" height="46" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="186.0" y="374.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >逻辑导入</text>
<text x="186.0" y="394.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >mysqldump / util.dumpInstance</text>
<rect x="354" y="356" width="252" height="46" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480.0" y="374.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >物理拷贝</text>
<text x="480.0" y="394.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >xtrabackup / Clone 插件</text>
<rect x="648" y="356" width="252" height="46" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="774.0" y="374.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >复制滚动</text>
<text x="774.0" y="394.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >新版本挂成从库，再切</text>
<rect x="60" y="430" width="252" height="50" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="186.0" y="450.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >跨大版本</text>
<text x="186.0" y="470.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >可以：导出的 SQL 与版本无关</text>
<rect x="60" y="492" width="252" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="186.0" y="512.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >可回滚</text>
<text x="186.0" y="532.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >不行：重来一遍，小时级</text>
<rect x="60" y="554" width="252" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="186.0" y="574.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >停机量级</text>
<text x="186.0" y="594.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >小时级：导入期间不可写</text>
<rect x="354" y="430" width="252" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="450.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >跨大版本</text>
<text x="480.0" y="470.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >不行：页格式绑定版本</text>
<rect x="354" y="492" width="252" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="512.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >可回滚</text>
<text x="480.0" y="532.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >只能回到备份点，丢增量</text>
<rect x="354" y="554" width="252" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="480.0" y="574.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >停机量级</text>
<text x="480.0" y="594.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >十分钟级：按页拷</text>
<rect x="648" y="430" width="252" height="50" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="774.0" y="450.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >跨大版本</text>
<text x="774.0" y="470.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >可以向上，只进不退</text>
<rect x="648" y="492" width="252" height="50" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="774.0" y="512.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >可回滚</text>
<text x="774.0" y="532.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >可以：改一次指向</text>
<rect x="648" y="554" width="252" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="774.0" y="574.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >停机量级</text>
<text x="774.0" y="594.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >秒级：一次主从切换</text>
<text x="54" y="622" font-size="11.5" fill="#111827" text-anchor="start" font-weight="400" >只有第三列在出错之后还有退路——这是滚动升级成为生产默认的原因，不是速度。</text>
<path d="M 60 652 L 86 652" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="93" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >可回退 / 可跨版本</text>
<path d="M 280 652 L 306 652" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="313" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >不可逆 / 不行</text>
<path d="M 470 652 L 496 652" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="503" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >复制链路</text>
<path d="M 620 652 L 646 652" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="653" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >停机窗口</text>
<path d="M 760 652 L 786 652" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="793" y="656" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >物理拷贝</text>
</svg>