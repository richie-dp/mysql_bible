<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 44-1　一条 SQL 的两个世界：Server 层不知道 B+ 树，引擎不知道你要干嘛</text>
<text x="24" y="60" font-size="12" fill="#6b7280">左边每一步都在 sql/，右边每一步都在 storage/innobase/；两列之间只隔着 handler 这一道门</text>
