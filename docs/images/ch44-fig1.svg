<text x="60" y="626" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >这一侧只认识执行计划：读哪个索引、什么方向、给几行</text>
<text x="540" y="626" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >这一侧只认识页与记录：在哪个页、加不加锁、算不算可见</text>
<text x="540" y="166" font-size="10.5" fill="#475569" text-anchor="start" font-weight="600" >跨过这道门，引擎只收到三件事：</text>
<text x="540" y="190" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >① 用哪个索引　② 往哪个方向　③ 要不要加锁</text>
<text x="540" y="214" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >它不知道这些行是给谁看的、为什么要看</text>
