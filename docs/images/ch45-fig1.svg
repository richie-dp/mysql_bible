<text x="162.0" y="503.0" font-size="11" fill="#9333ea" text-anchor="start" font-weight="500" >redo 记录</text>
<path d="M 394.0,470.0 L 394.0,528.0" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_9333ea)"/>
<rect x="399.0" y="493.0" width="61.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="402.0" y="503.0" font-size="11" fill="#9333ea" text-anchor="start" font-weight="500" >读页并回放</text>
<text x="650" y="500" font-size="11.5" fill="#111827" text-anchor="start" font-weight="600" >只读副本延迟的组成</text>
<text x="650" y="520" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >自建：回放线程追不追得上</text>
<text x="650" y="538" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >共享存储：日志何时到达</text>
<text x="650" y="560" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >后者与算力无关（第 25 章失效）</text>
<path d="M 64 620 L 90 620" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="97" y="624" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >数据页（整份副本）</text>
<path d="M 300 620 L 326 620" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="333" y="624" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >日志记录 / redo</text>
