<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="620" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 46-2　三个锁阶段：Online 仍然会卡，卡在两端</text>
<text x="24" y="60" font-size="12" fill="#6b7280">首尾两段 EXCLUSIVE 各自都是毫秒级——前提是表上没有未提交的事务</text>
<text x="900" y="104" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400" >时间 →</text>
<text x="40" y="162" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >DDL 线程</text>
<text x="40" y="272" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >长事务</text>
<text x="40" y="382" font-size="12" fill="#111827" text-anchor="start" font-weight="600" >业务查询</text>
<rect x="140" y="136" width="180" height="44" rx="6" ry="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" stroke-dasharray="5,3"/>
<text x="230" y="163" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600" >等 MDL X</text>
<text x="230" y="178" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="400" >被下面的报表事务拖住</text>
<rect x="320" y="136" width="42" height="44" rx="4" ry="4" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
<text x="341" y="126" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="600" >PREPARE</text>
<rect x="362" y="136" width="450" height="44" rx="5" ry="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="587" y="157" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="600" >EXECUTE｜SHARED｜允许 DML</text>
<text x="587" y="175" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >拷贝数据 + 记录增量，业务照常读写</text>
<rect x="812" y="136" width="42" height="44" rx="4" ry="4" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
<text x="833" y="126" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="600" >COMMIT</text>
<text x="890" y="163" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400" >放行</text>
<rect x="100" y="246" width="240" height="44" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="220.0" y="263.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >报表事务 23:50 起</text>
<text x="220.0" y="283.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >持有 MDL_SHARED_READ 不提交</text>
<path d="M 300.0,246.0 L 300.0,190.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5,4" marker-end="url(#m_e_dc2626)"/>
<rect x="177.7" y="212.0" width="117.3" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="292.0" y="222.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="500" >它不放手，X 就来不了</text>
<rect x="340" y="356" width="580" height="44" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="630.0" y="373.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >业务查询：全部排在 PENDING 的 X 后面</text>
<text x="630.0" y="393.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >MDL 写优先：后来的 S 不许插到 X 前面</text>
<path d="M 361.0,180.0 L 361.0,356.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4,4" marker-end="url(#m_e_475569)"/>
<rect x="366.0" y="262.0" width="61.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="369.0" y="272.0" font-size="11" fill="#475569" text-anchor="start" font-weight="500" >队列写优先</text>
<rect x="40" y="466" width="430" height="76" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="255.0" y="499.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >① 首端：等 MDL X</text>
<text x="255.0" y="519.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >长度 = 表上最老那个未提交事务的年龄</text>
<rect x="490" y="466" width="430" height="76" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="705.0" y="499.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >② 尾端：等活跃事务退出</text>
<text x="705.0" y="519.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >长度 = 它们还剩多久提交</text>
<rect x="40" y="560" width="880" height="44" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480.0" y="586.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >等待时间与表大小无关，只与表上还有几个没提交的事务有关</text>
</svg>