<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 47-1　门禁的天花板：上线这一刻，能看见的到这里为止</text>
<text x="24" y="60" font-size="12" fill="#6b7280">左边查的是文本形态与估算值，右边只有跑起来才有；中间那条竖线不是流程节点，是信息断点</text>
<text x="56" y="96" font-size="12" fill="#16a34a" text-anchor="start" font-weight="600" >能挡住的：静态文本 + 优化器估算</text>
<text x="528" y="96" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600" >挡不住的：只有运行时才有</text>
<rect x="408" y="104" width="144" height="24" rx="12.0" ry="12.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480.0" y="120.025" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >上线这一刻</text>
<path d="M 480.0,130.0 L 480.0,530.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5,6"/>
<rect x="56" y="140" width="376" height="390" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="70" y="162" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >进入系统之前：审的是 SQL 文本</text>
<rect x="76" y="178" width="336" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="244.0" y="217.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >语法与形态检查</text>
<text x="244.0" y="237.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >禁 SELECT *、无 WHERE 更新</text>
<rect x="76" y="286" width="336" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="244.0" y="325.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >影响行数估算</text>
<text x="244.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >EXPLAIN 的 rows 乘过滤率</text>
<rect x="76" y="394" width="336" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="244.0" y="433.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >DDL 的算法与锁</text>
<text x="244.0" y="453.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >ALGORITHM 与 LOCK 必须写明</text>
<rect x="528" y="140" width="376" height="390" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="542" y="162" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >跑起来之后：看的是真实数据</text>
<rect x="548" y="178" width="336" height="88" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="716.0" y="217.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >真实扫描行数</text>
<text x="716.0" y="237.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >估算值；统计信息旧了它也错</text>
<rect x="548" y="286" width="336" height="88" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="716.0" y="325.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >并发下的等待</text>
<text x="716.0" y="345.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >80ms × 50 QPS，等于 4 条在跑</text>
<rect x="548" y="394" width="336" height="88" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="716.0" y="433.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >链路总耗时</text>
<text x="716.0" y="453.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >12 条各 80ms，接口就是 960ms</text>
<path d="M 432.0,330.0 L 524.0,330.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="451.7" y="312.0" width="52.6" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="478.0" y="322.0" font-size="11" fill="#475569" text-anchor="middle" font-weight="500" >SQL 上线</text>
<rect x="56" y="552" width="848" height="62" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="480.0" y="578.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >门禁的价值：把低级错误挡在门外</text>
<text x="480.0" y="598.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >它不保证线上不出问题；当成保险，出事时第一句话就是「不是审核过了吗」</text>
</svg>