<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="660" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 47-2　治理闭环四步：每一步都要有名字、有期限、有归因</text>
<text x="24" y="60" font-size="12" fill="#6b7280">缺任何一步，整条链都退化成「每周筛一遍，再倒回同一个池子」</text>
<rect x="56" y="104" width="396" height="214" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="70" y="116" width="368" height="46" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="254.0" y="134.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" >① 聚合</text>
<text x="254.0" y="154.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >按 DIGEST 合并，不看单条</text>
<text x="76" y="190" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="600" >输入｜</text>
<text x="122" y="190" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >两份间隔快照（周初 / 周末）</text>
<text x="76" y="218" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="600" >产出｜</text>
<text x="122" y="218" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >增量 TOP 10，带 COUNT_STAR 增量</text>
<text x="76" y="246" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="600" >缺了它｜</text>
<text x="122" y="246" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >榜单被历史累计值占满</text>
<text x="76" y="274" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="600" >读法｜</text>
<text x="122" y="274" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >先看增量，再看次数</text>
<rect x="508" y="104" width="396" height="214" rx="10" ry="10" fill="#f9fafb" stroke="#fecaca" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="522" y="116" width="368" height="46" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="706.0" y="134.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" >② 定责</text>
<text x="706.0" y="154.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >唯一一步工具替不了</text>
<text x="528" y="190" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="600" >输入｜</text>
<text x="574" y="190" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >DIGEST + SCHEMA_NAME</text>
<text x="528" y="218" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="600" >产出｜</text>
<text x="574" y="218" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >业务名 + 具名 Owner</text>
<text x="528" y="246" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="600" >缺了它｜</text>
<text x="574" y="246" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >优化项烂在别人的待办里</text>
<text x="528" y="274" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="600" >断点｜</text>
<text x="574" y="274" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >表里没有 user / host</text>
<rect x="508" y="362" width="396" height="214" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="522" y="374" width="368" height="46" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="706.0" y="392.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" >③ 分派</text>
<text x="706.0" y="412.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >挂到人，带上期限</text>
<text x="528" y="448" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="600" >输入｜</text>
<text x="574" y="448" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >TOP N + 已认领的 Owner</text>
<text x="528" y="476" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="600" >产出｜</text>
<text x="574" y="476" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >SLA 与到期日</text>
<text x="528" y="504" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="600" >缺了它｜</text>
<text x="574" y="504" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >排期永远排在需求后面</text>
<text x="528" y="532" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="600" >期限｜</text>
<text x="574" y="532" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >P0 24h · P1 一周 · P2 季度</text>
<rect x="56" y="362" width="396" height="214" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="70" y="374" width="368" height="46" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="254.0" y="392.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" >④ 复盘</text>
<text x="254.0" y="412.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >看新增的从哪来</text>
<text x="76" y="448" font-size="10.5" fill="#9333ea" text-anchor="start" font-weight="600" >输入｜</text>
<text x="122" y="448" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >上月 TOP 与本月新增</text>
<text x="76" y="476" font-size="10.5" fill="#9333ea" text-anchor="start" font-weight="600" >产出｜</text>
<text x="122" y="476" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >归因：门禁失效 / 容量失效</text>
<text x="76" y="504" font-size="10.5" fill="#9333ea" text-anchor="start" font-weight="600" >缺了它｜</text>
<text x="122" y="504" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >同一个问题每季度复发</text>
<text x="76" y="532" font-size="10.5" fill="#9333ea" text-anchor="start" font-weight="600" >判据｜</text>
<text x="122" y="532" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >新功能查门禁，老功能查容量</text>
<path d="M 452.0,211.0 L 504.0,211.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 706.0,318.0 L 706.0,358.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 508.0,469.0 L 456.0,469.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 254.0,362.0 L 254.0,322.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="56" y="596" width="848" height="52" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="617.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >断点在「定责」：digest 表只有 SCHEMA_NAME</text>
<text x="480.0" y="637.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >没有 user / host，只能靠库名前缀或注释打标补上；注释是否参与归一化，先在测试库验证</text>
</svg>