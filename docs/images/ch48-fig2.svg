<text x="118" y="120" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >越往里越窄</text>
<text x="48" y="556" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >外层只挡「盘」</text>
<text x="48" y="576" font-size="11" fill="#111827" text-anchor="start" font-weight="600" >内层才挡「人」</text>
