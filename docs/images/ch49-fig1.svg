<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker></defs>
<rect width="960" height="700" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 49-1　订单三张表与主表状态机</text>
<text x="24" y="60" font-size="12" fill="#6b7280">拆表的判据是生命周期与访问频率；状态机的判据是能否单向收敛</text>
<rect x="60" y="84" width="400" height="470" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >三张表：行数从千万到十亿，行宽差一个数量级</text>
<rect x="80" y="120" width="360" height="96" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="260.0" y="163.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >order_main　订单主表</text>
<text x="260.0" y="183.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >3.2 亿行，日增 78 万</text>
<rect x="80" y="246" width="360" height="96" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="260.0" y="289.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >order_item　订单明细</text>
<text x="260.0" y="309.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >9 亿行，1 单 1~20 行，存下单快照</text>
<rect x="80" y="372" width="360" height="96" rx="8" ry="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="260.0" y="415.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >order_ext　订单扩展</text>
<text x="260.0" y="435.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >约 5% 的订单有行，只有详情页读</text>
<path d="M 150.0,216.0 L 150.0,246.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<path d="M 150.0,342.0 L 150.0,372.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<text x="160" y="238" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >1 : N</text>
<text x="160" y="364" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >1 : 0..1</text>
<text x="84" y="496" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >主表约 350 字节/行，一页放得下四十多行</text>
<text x="84" y="518" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >多一列 VARCHAR(200)，3.2 亿行就多几十 GB</text>
<text x="84" y="540" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >明细存快照价，改价不改历史订单</text>
<rect x="490" y="84" width="410" height="470" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="504" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >主表状态：五个值，迁移单向</text>
<rect x="515" y="120" width="165" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="597.5" y="144.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >待支付</text>
<text x="597.5" y="164.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >10</text>
<rect x="515" y="226" width="165" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="597.5" y="250.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >已支付</text>
<text x="597.5" y="270.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >20</text>
<rect x="515" y="332" width="165" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="597.5" y="356.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >已发货</text>
<text x="597.5" y="376.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >30</text>
<rect x="515" y="438" width="165" height="58" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="597.5" y="462.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >已完成</text>
<text x="597.5" y="482.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >90</text>
<rect x="740" y="120" width="140" height="58" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="810.0" y="144.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="600" >已关闭</text>
<text x="810.0" y="164.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >99</text>
<path d="M 597.0,178.0 L 597.0,226.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="602.0" y="196.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="605.0" y="206.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="500" >支付</text>
<path d="M 597.0,284.0 L 597.0,332.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_2563eb)"/>
<rect x="602.0" y="302.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="605.0" y="312.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="500" >发货</text>
<path d="M 597.0,390.0 L 597.0,438.0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_16a34a)"/>
<rect x="602.0" y="408.0" width="50.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="605.0" y="418.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="500" >确认收货</text>
<path d="M 680.0,149.0 L 740.0,149.0" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_dc2626)"/>
<rect x="696.0" y="129.0" width="28.0" height="16" fill="#ffffff" opacity="0.92" rx="3"/>
<text x="710.0" y="139.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500" >超时</text>
<text x="720" y="216" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >主表状态每多一个值，</text>
<text x="720" y="240" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >按状态查询的索引</text>
<text x="720" y="264" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >选择性就降一档；</text>
<text x="720" y="288" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >迁移组合数按平方涨</text>
<text x="515" y="524" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >终态不回退：重开只能新单据</text>
<rect x="60" y="572" width="840" height="80" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="604" font-size="11" fill="#111827" text-anchor="start" font-weight="600" >不该进主表的三个值：</text>
<rect x="266" y="586" width="106" height="26" rx="13.0" ry="13.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="319.0" y="603.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >退款中</text>
<rect x="386" y="586" width="106" height="26" rx="13.0" ry="13.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="439.0" y="603.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >部分退款</text>
<rect x="506" y="586" width="106" height="26" rx="13.0" ry="13.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="559.0" y="603.2" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >售后中</text>
<text x="628" y="604" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >→ order_event + after_sale 标记</text>
<text x="60" y="678" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >绿色为终态；红色三个值是事件，进事件表，不进状态列</text>
</svg>