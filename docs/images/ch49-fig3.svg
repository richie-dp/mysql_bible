<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 49-3　热点行拆桶之后，多出来的三个问题</text>
<text x="24" y="60" font-size="12" fill="#6b7280">拆桶把一行锁摊成 20 份，也把&quot;精确可用量&quot;换成了&quot;近似可用量&quot;</text>
<rect x="60" y="84" width="840" height="250" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="106" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >一个 SKU 拆成 20 桶：单行并发降到 1/20</text>
<rect x="400" y="112" width="160" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="480.0" y="135.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >stock 总量</text>
<text x="480.0" y="155.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >100 件，2400 次/秒</text>
<path d="M 480.0,168.0 L 480.0,196.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<path d="M 168.0,196.0 L 824.0,196.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 168.0,196.0 L 168.0,212.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="100" y="212" width="136" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="168.0" y="235.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >桶 0</text>
<text x="168.0" y="255.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >qty = 5</text>
<path d="M 332.0,196.0 L 332.0,212.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="264" y="212" width="136" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="332.0" y="235.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >桶 1</text>
<text x="332.0" y="255.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >qty = 5</text>
<path d="M 496.0,196.0 L 496.0,212.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="428" y="212" width="136" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="496.0" y="235.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >桶 2</text>
<text x="496.0" y="255.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >qty = 5</text>
<path d="M 660.0,196.0 L 660.0,212.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="592" y="212" width="136" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="660.0" y="235.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >桶 3</text>
<text x="660.0" y="255.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >qty = 5</text>
<path d="M 824.0,196.0 L 824.0,212.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="756" y="212" width="136" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="824.0" y="235.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" >桶 4</text>
<text x="824.0" y="255.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >qty = 5</text>
<text x="80" y="292" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >请求按 user_id % 20 落桶；单桶约 120 次/秒</text>
<text x="860" y="292" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400" >…共 20 桶</text>
<rect x="60" y="350" width="266" height="150" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="372" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >代价 ① 可用量要 SUM</text>
<text x="74" y="400" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >实时 SUM 20 行 = 一次聚合读</text>
<text x="74" y="426" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >要准确还得锁这 20 行</text>
<text x="74" y="452" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >只给得出“近似可用”</text>
<text x="74" y="478" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >结算任务定期修正偏差</text>
<rect x="347" y="350" width="266" height="150" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="361" y="372" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >代价 ② 桶之间不均衡</text>
<text x="361" y="400" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >热门桶先空，冷桶还有货</text>
<text x="361" y="426" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >借桶 = 一次跨行事务</text>
<text x="361" y="452" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >反向借桶就是死锁</text>
<text x="361" y="478" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >借桶要限频，否则成新热点</text>
<rect x="634" y="350" width="266" height="150" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="648" y="372" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >代价 ③ 总量调整改 20 行</text>
<text x="648" y="400" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >运营改库存要动 20 行</text>
<text x="648" y="426" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >改到第 13 行失败，总量就错</text>
<text x="648" y="452" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >同事务或版本校验兜底</text>
<text x="648" y="478" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >异步改则留下不一致窗口</text>
<rect x="60" y="520" width="840" height="60" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="544" font-size="10.5" fill="#111827" text-anchor="start" font-weight="400" >拆桶拆的是锁，不是问题：单行热点没了，聚合读、桶倾斜、总量一致性全冒出来</text>
<text x="74" y="566" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >秒杀真正的解法是把瞬时并发削成可持续速率；数据库只守最后一道&quot;不超卖&quot;</text>
<path d="M 60 600 L 86 600" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="93" y="604" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >热点行</text>
<path d="M 200 600 L 226 600" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="233" y="604" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >拆出来的桶</text>
<path d="M 380 600 L 406 600" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m_e_475569)"/>
<text x="413" y="604" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >落桶路由</text>
</svg>