<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'SimHei', sans-serif; }</style>
<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker><marker id="m_e_dc2626" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="m_e_16a34a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="m_e_2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="m_e_ea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="m_e_9333ea" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker></defs>
<rect width="960" height="660" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 50-2　两个&quot;MySQL 顶不住&quot;的场景结构：组合爆炸与读写互斥</text>
<text x="24" y="60" font-size="12" fill="#6b7280">上半是&quot;条件自由组合&quot;，下半是&quot;读的便宜与写的便宜互为镜像&quot;；两者都不靠加索引解决</text>
<rect x="60" y="80" width="840" height="264" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="102" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >标签筛选：每多一个可筛选标签，查询组合数翻一倍</text>
<path d="M 96.0,280.0 L 96.0,118.0" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
<rect x="96" y="279" width="308" height="1.5" rx="0" ry="0" fill="#d1d5db" stroke="#d1d5db" stroke-width="0"/>
<rect x="110" y="258" width="34" height="22" rx="4" ry="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="127" y="250" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="600" >2</text>
<text x="127" y="296" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >n=1</text>
<rect x="158" y="238" width="34" height="42" rx="4" ry="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="175" y="230" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="600" >16</text>
<text x="175" y="296" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >n=4</text>
<rect x="206" y="216" width="34" height="64" rx="4" ry="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="223" y="208" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="600" >256</text>
<text x="223" y="296" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >n=8</text>
<rect x="254" y="192" width="34" height="88" rx="4" ry="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="271" y="184" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600" >4 千</text>
<text x="271" y="296" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >n=12</text>
<rect x="302" y="170" width="34" height="110" rx="4" ry="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="319" y="162" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600" >6.5 万</text>
<text x="319" y="296" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >n=16</text>
<rect x="350" y="148" width="34" height="132" rx="4" ry="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="367" y="140" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600" >105 万</text>
<text x="367" y="296" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >n=20</text>
<text x="96" y="316" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >横轴：可筛选标签个数　纵轴：组合数（对数刻度）</text>
<text x="96" y="334" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >20 个标签 = 1,048,576 种组合，不可能靠建索引覆盖</text>
<rect x="430" y="108" width="112" height="38" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="486.0" y="130.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >组合索引</text>
<text x="556" y="132" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >≤ 2~3 个固定组合，且最左前缀对得上</text>
<rect x="430" y="154" width="112" height="38" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="486.0" y="176.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >位图 BIT</text>
<text x="556" y="178" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >≤ 64 个标签，位运算不走索引，只能全扫</text>
<rect x="430" y="200" width="112" height="38" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="486.0" y="222.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >倒排表</text>
<text x="556" y="224" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >千万级、条件自由组合，瓶颈是回表次数</text>
<rect x="430" y="246" width="112" height="38" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="486.0" y="268.85" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" >ES 兜底</text>
<text x="556" y="270" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >再往上，或需要相关性排序</text>
<rect x="60" y="356" width="840" height="228" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="74" y="378" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >树形结构：四种存法，读的代价与写的代价互为镜像</text>
<rect x="76" y="388" width="190" height="34" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="171.0" y="409.025" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >邻接表 parent_id</text>
<text x="86" y="450" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >查子树：递归 N 次查找</text>
<text x="86" y="480" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >写节点：插入一行</text>
<text x="86" y="510" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >移动：改一行 parent_id</text>
<text x="86" y="540" font-size="10" fill="#2563eb" text-anchor="start" font-weight="400" >适合：层浅、读多写少</text>
<rect x="282" y="388" width="190" height="34" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="377.0" y="409.025" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >路径枚举 path</text>
<text x="292" y="450" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >查子树：LIKE 前缀一次扫</text>
<text x="292" y="480" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >写节点：一行，带 path</text>
<text x="292" y="510" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >移动：改整棵子树的 path</text>
<text x="292" y="540" font-size="10" fill="#0d9488" text-anchor="start" font-weight="400" >适合：频繁查子树</text>
<rect x="488" y="388" width="190" height="34" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="583.0" y="409.025" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >闭包表 祖先边</text>
<text x="498" y="450" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >查子树：一次等值查询</text>
<text x="498" y="480" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >写节点：写深度条祖先边</text>
<text x="498" y="510" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >移动：删旧边、插新边</text>
<text x="498" y="540" font-size="10" fill="#9333ea" text-anchor="start" font-weight="400" >适合：层级深、模式多</text>
<rect x="694" y="388" width="190" height="34" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="789.0" y="409.025" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600" >嵌套集 lft/rgt</text>
<text x="704" y="450" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >查子树：一次 BETWEEN</text>
<text x="704" y="480" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >写节点：平均改半张表</text>
<text x="704" y="510" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >移动：几乎重建全表</text>
<text x="704" y="540" font-size="10" fill="#ea580c" text-anchor="start" font-weight="400" >适合：几乎不变的分类</text>
<text x="60" y="616" font-size="11.5" fill="#111827" text-anchor="start" font-weight="600" >树形结构没有&quot;最优存法&quot;：只有&quot;你的读模式更贵，还是写模式更贵&quot;</text>
<path d="M 60 642 L 86 642" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#m_e_dc2626)"/>
<text x="93" y="646" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >组合爆炸 / 热点</text>
<path d="M 250 642 L 276 642" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#m_e_16a34a)"/>
<text x="283" y="646" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >可接受</text>
<path d="M 370 642 L 396 642" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m_e_2563eb)"/>
<text x="403" y="646" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >常规路径</text>
<path d="M 510 642 L 536 642" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#m_e_ea580c)"/>
<text x="543" y="646" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >写放大</text>
<path d="M 650 642 L 676 642" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#m_e_9333ea)"/>
<text x="683" y="646" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >外部组件</text>
</svg>