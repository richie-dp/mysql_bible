<text x="112" y="312" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="400" >400</text>
<text x="112" y="366" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="400" >200</text>
<text x="112" y="424" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="400" >0</text>
<path d="M 130.0,418.0 L 235.0,418.0 L 340.0,416.0 L 445.0,413.0 L 550.0,407.0 L 655.0,396.0 L 760.0,359.0 L 865.0,308.0" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round"/>
<text x="300" y="404" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >拐点之前几乎是一条直线</text>
<path d="M 655.0,124.0 L 655.0,420.0" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6,4"/>
<text x="664" y="122" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600" >拐点：TPS 增幅 &lt; 10%，P99 翻倍</text>
<text x="683" y="200" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >再往上加并发</text>
<text x="683" y="216" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400" >只加排队，不加吞吐</text>
<text x="130" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >8</text>
<text x="235" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >16</text>
<text x="340" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >32</text>
<text x="445" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >64</text>
<text x="550" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >96</text>
<text x="655" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >128</text>
<text x="760" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >192</text>
<text x="865" y="442" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >256</text>
<text x="884" y="460" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="400" >并发 →</text>
<rect x="64" y="476" width="14" height="14" rx="7" ry="7" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
<rect x="62" y="494" width="253" height="78" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="188.5" y="528.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >P99 非线性上升</text>
<text x="188.5" y="548.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >每轮加压翻一倍，P50 还稳</text>
<rect x="369" y="476" width="14" height="14" rx="7" ry="7" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/>
<rect x="367" y="494" width="253" height="78" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="493.5" y="528.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >Threads_running 顶住</text>
<text x="493.5" y="548.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >贴着压测并发数，撤压也不降</text>
<rect x="674" y="476" width="14" height="14" rx="7" ry="7" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
<rect x="672" y="494" width="253" height="78" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="798.5" y="528.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600" >wait_free / queue 出现</text>
<text x="798.5" y="548.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >刷脏跟不上，请求堵在门口</text>
<text x="50" y="604" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >三个信号里任何一个亮起，台阶就到底了；三个一起亮，说明瓶颈已经不在 CPU 上</text>
<text x="50" y="624" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >错误率突变是第四个信号，它出现在拐点之后：先是超时，再是连接拒绝，最后是死锁激增</text>
</svg>