<text x="150" y="152" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="400" >压测库命中率接近 100%：加并发就涨</text>
<text x="72" y="300" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600" >P99 (ms)</text>
<path d="M 120.0,420.0 L 120.0,302.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
