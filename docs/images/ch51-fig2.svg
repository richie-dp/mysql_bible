<defs><marker id="m_e_475569" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#111827">图 51-2　阶梯压测上的拐点与三个信号</text>
<text x="24" y="60" font-size="12" fill="#6b7280">同一份数据只改并发：TPS 先饱和、P99 后跳起，所以只看 TPS 曲线会晚一步</text>
<rect x="50" y="78" width="860" height="388" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="100" font-size="13" fill="#6b7280" text-anchor="start" font-weight="600" >在 2000 万行的压测库上做阶梯压测（按示例系统设定推算的形态）</text>
<text x="72" y="120" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600" >TPS</text>
<path d="M 120.0,240.0 L 120.0,124.0" fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#m_e_475569)"/>
